<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSANDE Finals Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="app-style">
/* Layout idea: a project binder. Sticky index on the left, sections behind divider tabs, a dated timeline up top. */
:root{
  --paper:#EBEDE8; --sheet:#FAFBF8; --ink:#15171C; --muted:#5B6068; --line:#D3D6CF;
  --accent:#2347D6; --accent-soft:#DDE3FB; --mark:#F2CF3B;
  --ok:#1E8150; --ok-soft:#D9EFE2; --warn:#A8690F; --warn-soft:#F7E8CC; --bad:#BE3B27;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101215; --sheet:#171A1E; --ink:#E7E9E4; --muted:#99A0A9; --line:#2A2F36;
    --accent:#8198FF; --accent-soft:#232C4D; --mark:#E3BF2C;
    --ok:#5CC48C; --ok-soft:#183325; --warn:#E0A548; --warn-soft:#3A2B12; --bad:#F07A63;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101215; --sheet:#171A1E; --ink:#E7E9E4; --muted:#99A0A9; --line:#2A2F36;
  --accent:#8198FF; --accent-soft:#232C4D; --mark:#E3BF2C;
  --ok:#5CC48C; --ok-soft:#183325; --warn:#E0A548; --warn-soft:#3A2B12; --bad:#F07A63;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto;padding:32px 28px 80px}
nav.index{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.index .brand{font:800 13px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.08em;margin-bottom:18px;color:var(--muted)}
nav.index a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);padding:6px 8px;border-radius:4px;font-weight:500}
nav.index a span{font:600 11px var(--f-mono);color:var(--muted);opacity:.7;width:18px}
nav.index a:hover{color:var(--ink);background:var(--sheet)}
nav.index .sync{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;padding:0 8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

main{display:flex;flex-direction:column;gap:28px;min-width:0}
header.top{display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.kicker{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--muted)}
.kicker input{background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0;min-width:180px;color:var(--ink);font-weight:600}
.kicker input:hover{border-bottom-color:var(--muted)}
header.top h1{font-size:clamp(34px,5vw,54px);line-height:1;font-weight:800}
header.top h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark) 62%);padding:0 2px}
.roster{display:flex;flex-wrap:wrap;gap:6px}
.roster span{font:600 12px var(--f-mono);letter-spacing:.04em;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:var(--sheet)}

/* icons + polish */
.ic{width:17px;height:17px;flex:none;vertical-align:-3px}
.ic.tiny{width:13px;height:13px;vertical-align:-2px}
.btn,.pick,a.open,.vote,.status,nav.index a,.stat,.help{transition:background-color .15s,border-color .15s,color .15s,transform .15s,box-shadow .15s}
.btn,.pick,a.open{display:inline-flex;align-items:center;gap:7px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.btn.ghost:hover{background:var(--ink);color:var(--sheet)}
.pick:hover{background:var(--ink);color:var(--sheet)}
.opt.chosen .pick:hover{background:var(--accent)}
.vote:hover{border-color:var(--ink);color:var(--ink)}
.status:hover{filter:brightness(.96)}
.lbl-i{display:flex;align-items:center;gap:5px}
.lbl-i .ic{width:13px;height:13px}
.sdg{align-items:center;color:var(--muted)}
.rm{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;display:inline-flex;gap:4px;align-items:center;padding:4px;border-radius:3px}
.rm:hover{color:var(--bad)}
.rm .ic{width:14px;height:14px}
.ex-badge{display:inline-flex;align-items:center;gap:6px}
.ex-badge .ic{width:14px;height:14px}
.tab{display:flex;align-items:center;gap:6px}
.tab .ic{width:13px;height:13px;color:var(--accent)}
.tab i{margin-right:0}
.link .edit{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:4px;text-decoration:none}
.link .edit:hover{background:var(--paper);color:var(--ink)}
.log .x{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:4px}
.log .x:hover{color:var(--bad);background:var(--paper)}
.log .x .ic{width:15px;height:15px}
nav.index .brand{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;color:var(--ink);font-size:16px}
nav.index .brand small{display:block;font:500 11.5px var(--f-body);color:var(--muted);margin-top:2px}
nav.index .logo{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--sheet);display:grid;place-items:center}
nav.index .logo .ic{width:18px;height:18px}
nav.index a{align-items:center;border-left:2px solid transparent;border-radius:0 4px 4px 0}
nav.index a .ic{opacity:.75}
nav.index a span.nl{font:inherit;width:auto;opacity:1;color:inherit;white-space:nowrap}
nav.index a.active{color:var(--ink);background:var(--sheet);border-left-color:var(--accent);font-weight:600}
nav.index a.active .ic{color:var(--accent);opacity:1}
nav.index .help{display:flex;align-items:center;gap:8px}
.theme{display:flex;gap:2px;margin-top:10px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.theme button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:4px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.theme button .ic{width:16px;height:16px}
.theme button:hover{color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.g-demo .theme{margin:0;width:240px}
.roster span{display:inline-flex;align-items:center;gap:6px}
.roster i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
.stat{position:relative;display:flex;gap:12px;align-items:center;padding:14px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);min-width:0}
.stat:hover{border-color:var(--ink);transform:translateY(-1px)}
.stat .si{width:36px;height:36px;border-radius:8px;background:var(--paper);display:grid;place-items:center;flex:none;color:var(--accent)}
.stat > span:nth-child(2){min-width:0}
.stat b{display:block;font:800 24px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat b.sm{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.urgent{color:var(--bad)} .stat b.soon{color:var(--warn)}
.stat small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{margin-left:auto;width:30px;height:30px;border-radius:50%;flex:none;background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--line) 0);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px)}
.idea-grid .opt:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion: reduce){.btn,.pick,a.open,.vote,.status,nav.index a,.stat,.help{transition:none}.btn:hover,.stat:hover{transform:none}}

/* timeline */
.timeline{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px 22px 18px}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.tl-head h2{font-size:18px}
.next{font-size:14px;color:var(--muted)}
.next b{color:var(--ink)}
.track-wrap{overflow-x:auto}
.track{position:relative;height:150px;min-width:640px}
.rail{position:absolute;left:0;right:0;top:74px;height:2px;background:var(--line)}
.rail-done{position:absolute;left:0;top:74px;height:2px;background:var(--ink)}
.today{position:absolute;top:56px;width:2px;height:38px;background:var(--bad)}
.today b{position:absolute;top:22px;left:6px;font:600 10px var(--f-mono);color:var(--bad);letter-spacing:.06em;white-space:nowrap}
.pin{position:absolute;top:68px;width:14px;height:14px;margin-left:-7px;border:2px solid var(--ink);background:var(--sheet);transform:rotate(45deg)}
.pin.past{background:var(--ink)}
.pin.soon{border-color:var(--warn);background:var(--warn)}
.pin-label{position:absolute;width:150px;margin-left:-75px;text-align:center;font-size:12.5px;line-height:1.3}
.pin-label.up{bottom:92px}
.pin-label.down{top:92px}
.pin-label .d{display:block;font:600 11px var(--f-mono);color:var(--muted);margin-bottom:2px}
.pin-label.tbd .d{color:var(--warn)}
.month{position:absolute;top:82px;font:600 10px var(--f-mono);color:var(--muted);letter-spacing:.1em;padding-top:4px}

/* sections */
section.part{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:26px 26px 24px;margin-top:22px;scroll-margin-top:20px}
.tab{position:absolute;top:-23px;left:-1px;height:23px;padding:3px 12px 0;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tab i{font-style:normal;color:var(--accent);margin-right:6px}
.part-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.part-head h2{font-size:24px;font-weight:700}
.part-head p{margin:4px 0 0;color:var(--muted);max-width:62ch;font-size:14px}

/* project options */
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:4px}
.opt{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);position:relative}
.opt:first-child{border-left:0}
.opt.chosen{background:var(--accent-soft)}
.opt.chosen::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.opt h3{font-size:20px;font-weight:700}
.opt .what{font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.opt p{margin:0;font-size:14px}
.opt ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.sdg{display:flex;gap:6px;flex-wrap:wrap}
.sdg span{font:600 11px var(--f-mono);padding:2px 6px;border-radius:3px;background:var(--paper);border:1px solid var(--line)}
.votes{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.votes .row{display:flex;gap:4px;flex-wrap:wrap}
.vote{border:1px solid var(--line);background:transparent;border-radius:3px;padding:3px 7px;font:600 11px var(--f-mono);cursor:pointer;color:var(--muted)}
.vote.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pick{align-self:flex-start;border:1px solid var(--ink);background:transparent;border-radius:4px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.opt.chosen .pick{background:var(--accent);border-color:var(--accent);color:#fff}

/* ideas */
.idea-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;border:1px solid var(--ink);border-radius:4px;padding:18px;margin-bottom:18px;background:var(--paper)}
.idea-form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.idea-form .wide{grid-column:1/-1}
.idea-form input,.idea-form select,.idea-form textarea{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--sheet);font-size:14px;font-weight:400;color:var(--ink);resize:vertical}
.idea-form input:focus,.idea-form select:focus,.idea-form textarea:focus{outline:none;border-color:var(--accent)}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.idea-grid .opt{border:1px solid var(--ink);border-radius:4px}
.idea-grid .opt.chosen{border-color:var(--accent)}
.opt .by{color:var(--accent)}
.idea-empty{border:1px dashed var(--line);border-radius:4px;padding:22px;color:var(--muted);font-size:14px;text-align:center}
.ex-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:30px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
.ex-badge{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px dashed var(--muted);border-radius:3px;color:var(--muted)}
.ex-head p{margin:0;font-size:13px;color:var(--muted)}
.examples .opt{opacity:.92}

/* tasks */
.ms{border-top:1px solid var(--line);padding:18px 0 6px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px}
.ms:first-of-type{border-top:0;padding-top:0}
.ms-date{display:flex;flex-direction:column;gap:4px}
.ms-date .d{font:600 15px var(--f-mono)}
.ms-date .left{font-size:12px;color:var(--muted)}
.ms-date .left.urgent{color:var(--bad);font-weight:600}
.ms-date .left.soon{color:var(--warn);font-weight:600}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:var(--ok)}
.ms h3{font-size:17px;margin-bottom:4px}
.ms .note{font-size:13px;color:var(--muted);margin:0 0 10px}
.ms .note strong{color:var(--warn)}
table.tasks{width:100%;border-collapse:collapse;font-size:14px}
.tasks td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tasks tr:last-child td{border-bottom:0}
.tasks td.t{width:100%}
.tasks tr.done td.t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.status{border:0;border-radius:3px;padding:3px 8px;font:600 11px var(--f-mono);letter-spacing:.04em;cursor:pointer;white-space:nowrap;min-width:64px}
.status.todo{background:var(--paper);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.status.doing{background:var(--warn-soft);color:var(--warn)}
.status.done{background:var(--ok-soft);color:var(--ok)}
.owner{background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 4px;font-size:12.5px;max-width:120px}

/* team */
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:4px}
.member{padding:18px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;border-top:1px solid var(--line)}
.member:nth-child(-n+2){border-top:0}
.member:nth-child(even){border-left:1px solid var(--line)}
.mono-badge{width:48px;height:48px;border-radius:4px;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font:800 18px var(--f-display)}
.member .name{font:700 17px var(--f-display)}
.member .name small{font:500 13px var(--f-body);color:var(--muted);margin-left:4px}
.field{display:block;width:100%;border:0;border-bottom:1px dashed transparent;background:transparent;padding:2px 0;font-size:14px}
.field:hover{border-bottom-color:var(--line)}
.field:focus{border-bottom-color:var(--accent);outline:none}
.field.role{font-weight:600;color:var(--accent)}
.field.focus{color:var(--muted);font-size:13.5px}
.load{font:600 11px var(--f-mono);color:var(--muted);margin-top:6px}

/* links */
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.link{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:4px}
.link.set{border-color:var(--ink)}
.ico{width:34px;height:34px;border-radius:4px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line)}
.ico svg{width:18px;height:18px}
.link .lbl{font-weight:600;font-size:14px}
.link .hint{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link a.open{font-weight:600;font-size:13px;text-decoration:none;border:1px solid var(--ink);color:var(--ink);padding:5px 10px;border-radius:4px;white-space:nowrap}
.link a.open:hover{background:var(--ink);color:var(--sheet)}
.link .edit{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px}
.link form{grid-column:1/-1;display:flex;gap:8px}
.link form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--paper);font-size:13px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:4px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}

/* rules + grading */
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.rules li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rules li:last-child{border-bottom:0}
.rules b{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.bar{display:flex;height:38px;border-radius:4px;overflow:hidden;border:1px solid var(--ink)}
.bar div{display:flex;align-items:center;padding:0 10px;font:600 13px var(--f-mono);border-left:1px solid var(--ink)}
.bar div:first-child{border-left:0}
.bar .a{background:var(--sheet)} .bar .b{background:var(--accent-soft)} .bar .c{background:var(--mark);color:#15171C}
.legend{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.legend li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:6px}
.legend .mono{font-weight:600}

/* log */
.log-form{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:8px;margin-bottom:14px}
.log-form select,.log-form input{border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--paper);font-size:14px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:96px 90px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.log .when{font:12px var(--f-mono);color:var(--muted)}
.log .who{font-weight:600;font-size:13px}
.log .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* loader */
.loader{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;place-items:center;transition:opacity .4s ease}
.loader.hide{opacity:0;pointer-events:none}
.ld{display:flex;flex-direction:column;align-items:center;gap:18px}
.ld-stack{position:relative;width:132px;height:92px}
.ld-sheet{position:absolute;left:0;right:0;height:72px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:0 5px 5px 5px;animation:ldUp 1.1s cubic-bezier(.2,.8,.2,1) both}
.ld-sheet::before{content:"";position:absolute;top:-11px;left:-1.5px;width:34px;height:11px;background:var(--sheet);border:1.5px solid var(--ink);border-bottom:0;border-radius:4px 4px 0 0}
.ld-sheet:nth-child(1){top:20px;animation-delay:0s}
.ld-sheet:nth-child(1)::before{left:auto;right:-1.5px;background:var(--mark)}
.ld-sheet:nth-child(2){top:10px;animation-delay:.12s}
.ld-sheet:nth-child(2)::before{left:48px;background:var(--accent-soft)}
.ld-sheet:nth-child(3){top:0;animation-delay:.24s}
@keyframes ldUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.ld-bar{width:180px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.ld-bar b{display:block;height:100%;width:0;background:var(--ink);animation:ldFill 1.3s ease forwards}
@keyframes ldFill{to{width:100%}}
.ld-text{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ld-names{font:700 15px var(--f-display);letter-spacing:.02em}

/* guide */
.guide{position:fixed;inset:0;z-index:55;background:rgba(10,12,16,.55);display:grid;place-items:center;padding:16px}
.guide[hidden]{display:none}
.g-card{position:relative;width:min(560px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:0 8px 8px 8px;box-shadow:0 24px 60px rgba(0,0,0,.25);padding:30px 30px 22px;display:flex;flex-direction:column;gap:14px}
.g-tab{position:absolute;top:-25px;left:-1px;height:25px;padding:4px 12px 0;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.g-tab b{color:var(--accent)}
.g-card h2{font-size:26px;font-weight:800;line-height:1.1}
.g-card p{margin:0;color:var(--muted);font-size:15px;max-width:60ch}
.g-demo{border:1px dashed var(--line);border-radius:5px;padding:14px;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;min-height:62px}
.g-demo .status{cursor:default}
.g-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.g-dots{display:flex;gap:6px}
.g-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.g-dots i.on{background:var(--ink)}
.g-btns{display:flex;gap:8px}
.g-skip{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
nav.index .help{margin-top:10px;border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:7px 8px;text-align:left;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
nav.index .help:hover{border-color:var(--ink)}
@media (prefers-reduced-motion: reduce){.ld-sheet,.ld-bar b{animation:none}.ld-bar b{width:100%}.loader{transition:none}}
@media (max-width:900px){nav.index .help{margin-top:0;white-space:nowrap}}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:18px;padding:18px 16px 60px}
  nav.index{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.index{position:sticky;top:0;z-index:20;background:var(--paper);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line);align-items:center}
  nav.index .brand,nav.index .sync{display:none}
  nav.index a{white-space:nowrap;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  nav.index a.active{border-color:var(--accent)}
  .theme{margin-top:0;flex:none}
  .theme button{flex-direction:row;padding:6px 8px}
  .theme button span{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .options,.team,.links,.two,.idea-form{grid-template-columns:1fr}
  .opt{border-left:0;border-top:1px solid var(--line)} .opt:first-child{border-top:0}
  .member{border-left:0 !important;border-top:1px solid var(--line) !important} .member:first-child{border-top:0 !important}
  .ms{grid-template-columns:1fr;gap:8px}
  section.part{padding:22px 16px 18px}
  .log-form{grid-template-columns:1fr}
  .log li{grid-template-columns:80px minmax(0,1fr) auto}
  .log .who{grid-column:2} .log .txt{grid-column:1/-1;grid-row:2}
}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function parse(d){ if(!d) return null; var p=d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function iso(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  function today(){ var n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  function member(id){ for(var i=0;i<state.members.length;i++) if(state.members[i].id===id) return state.members[i]; return null; }

    video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="14" height="14" rx="1"/><path d="M16 10l6-3v10l-6-3"/></svg>',

  /* ---------- theme ---------- */
  var ROOT = document.documentElement, HOST_THEME = ROOT.getAttribute('data-theme'), THEME_KEY='finals-portal-theme';

    return '<div class="theme" role="group" aria-label="Color theme">'+

    spy();

  var spyObs = null;
  function spy(){
    if(!('IntersectionObserver' in window)) return;
    if(spyObs) spyObs.disconnect();
    spyObs = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ document.querySelectorAll('[data-nav]').forEach(function(a){ a.classList.toggle('active', a.dataset.nav===e.target.id); }); } });

  function renderTimeline(){
    var start = new Date(2026,10,10), end = new Date(2027,0,6);
    var span = end - start;
    function pos(dt){ return Math.max(1, Math.min(99, (dt-start)/span*100)); }
    var pins = state.milestones.map(function(m){ return {m:m, d:dueOf(m)}; });
    var dated = pins.filter(function(p){return p.d;}).sort(function(a,b){return a.d-b.d;});
    var t = today();
    var next = dated.filter(function(p){ return p.d>=t; })[0];
    var h = '<div class="timeline" id="timeline"><div class="tl-head"><h2>Timeline</h2>';
    if(next){ var l=leftText(next.d); h += '<div class="next">Next up: <b>'+esc(next.m.title)+'</b> · '+esc(fmt(next.d))+' · '+esc(l.t)+'</div>'; }
    h += '</div><div class="track-wrap"><div class="track">';
    h += '<div class="rail"></div><div class="rail-done" style="width:'+pos(t)+'%"></div>';
    [[new Date(2026,10,1),'NOV'],[new Date(2026,11,1),'DEC'],[new Date(2027,0,1),'JAN']].forEach(function(mo){
      if(mo[0]>=start) h += '<div class="month" style="left:'+pos(mo[0])+'%">'+mo[1]+'</div>';
      else h += '<div class="month" style="left:0">'+mo[1]+'</div>';
    });
    h += '<div class="today" style="left:'+pos(t)+'%"><b>TODAY</b></div>';
    var i = 0;
    dated.forEach(function(p){
      var cls = p.d < t ? 'past' : (daysTo(p.d)<=7 ? 'soon' : '');
      h += '<div class="pin '+cls+'" style="left:'+pos(p.d)+'%"></div>';
      h += '<div class="pin-label '+(i%2?'down':'up')+'" style="left:clamp(75px,'+pos(p.d)+'%,calc(100% - 75px))"><span class="d">'+MON[p.d.getMonth()]+' '+p.d.getDate()+'</span>'+esc(p.m.title)+'</div>';
      i++;
    });
    h += '</div></div>';
    var undated = pins.filter(function(p){return !p.d;});
    if(undated.length){
      h += '<div class="next" style="margin-top:4px"><span class="mono" style="color:var(--warn);font-weight:600;font-size:12px">DATE TBD</span> '+undated.map(function(p){return esc(p.m.title);}).join(' · ')+'. Set the final presentation date at the top.</div>';
    }
    h += '</div>';
    return h;
  }

  /* ---------- state changes ---------- */
  function findItem(id){ for(var a=0;a<state.milestones.length;a++){ var it=state.milestones[a].items; for(var b=0;b<it.length;b++) if(it[b].id===id) return it[b]; } return null; }

  function commit(msg){
    var y = window.scrollY;
    render(); window.scrollTo(0,y);
    if(mode==='readonly'){ toast('View only: ask the owner for edit access'); return; }
    if(mode!=='shared'){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} if(msg) toast(msg+' (this device)'); return; }
    clearTimeout(timer);
    timer = setTimeout(publish, 900);
    if(msg) toast(msg);
  }

  function buildDoc(){
    var json = JSON.stringify(state).replace(/</g,'\\u003c');
    var head = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>SYSANDE Finals Portal</title>\n'+
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
      document.getElementById('app-fonts').outerHTML+'\n'+document.getElementById('app-style').outerHTML;
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+head+'\n</head>\n<body>\n'+
      '<script type="application/json" id="portal-state">'+json+'<\/script>\n'+
      '<div id="app"></div>\n<div class="toast" id="toast" role="status" aria-live="polite"></div>\n'+
      SELF.outerHTML+'\n</body>\n</html>';
  }

  function publish(){
    if(!api) return;
    api.publish(buildDoc()).catch(function(err){
      var code = (err && (err.code||err.name||err.message))||'';
      if(/not_granted|not_writer/.test(code)){ mode='readonly'; render(); toast('View only: your changes were not saved'); }
      else if(/conflict/.test(code)){ /* another view won; page reloads */ }
      else toast('Could not save. Try again in a moment.');
    });
  }

  var toastT;
  function toast(t){ var el=document.getElementById('toast'); if(!el) return; el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('show');},1800); }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.status){ var it=findItem(b.dataset.status); it.status = STATUSES[(STATUSES.indexOf(it.status)+1)%3]; commit(); }
    else if(b.dataset.vote){ var o=findProject(b.dataset.vote); var i=o.votes.indexOf(b.dataset.m); if(i>-1) o.votes.splice(i,1); else o.votes.push(b.dataset.m); commit(); }
    else if(b.dataset.pick){ state.chosen = state.chosen===b.dataset.pick ? '' : b.dataset.pick; commit(state.chosen?'Project locked in':'Choice cleared'); }
    else if(b.dataset.editlink){ editingLink=b.dataset.editlink; var y=window.scrollY; render(); window.scrollTo(0,y); var inp=document.getElementById('link-'+editingLink); if(inp) inp.focus(); }
    else if(b.dataset.cancel){ editingLink=null; var y2=window.scrollY; render(); window.scrollTo(0,y2); }
    else if(b.dataset.ideaform){ ideaFormOpen=!ideaFormOpen; var y3=window.scrollY; render(); window.scrollTo(0,y3); var f=document.getElementById('i-by'); if(f) f.focus(); }
    else if(b.dataset.delidea){ state.ideas=(state.ideas||[]).filter(function(x){return x.id!==b.dataset.delidea;}); if(state.chosen===b.dataset.delidea) state.chosen=''; commit('Idea removed'); }
    else if(b.dataset.themeSet){ themePref=b.dataset.themeSet; try{ localStorage.setItem(THEME_KEY, themePref); }catch(e){} applyTheme(); document.querySelectorAll('[data-theme-set]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.themeSet===themePref)); }); }
    else if(b.dataset.guide){ openGuide(0); }
    else if(b.dataset.g){ guideNav(b.dataset.g); }
    else if(b.dataset.dellog){ state.log = state.log.filter(function(x){return x.id!==b.dataset.dellog;}); commit('Update removed'); }
  });

  document.addEventListener('change', function(e){
    var el = e.target;
    if(el.dataset.owner){ findItem(el.dataset.owner).owner = el.value; commit(); }
    else if(el.dataset.mrole){ member(el.dataset.mrole).role = el.value.trim(); commit('Role updated'); }
    else if(el.dataset.mfocus){ member(el.dataset.mfocus).focus = el.value.trim(); commit('Saved'); }
    else if(el.id==='f-course'){ state.course = el.value.trim(); commit('Saved'); }
    else if(el.id==='f-final'){ state.finalDate = el.value; commit('Presentation date set'); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.matches('.field, #f-course')){ e.preventDefault(); e.target.blur(); }
  });

  document.addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target;
    if(f.dataset.linkform){
      var v = document.getElementById('link-'+f.dataset.linkform).value.trim();
      if(v && !/^https?:\/\//i.test(v)) v = 'https://'+v;
      state.links.forEach(function(k){ if(k.id===f.dataset.linkform) k.url=v; });
      editingLink=null; commit(v?'Link saved':'Link removed');
    } else if(f.id==='idea-form'){
      function val(id){ return document.getElementById(id).value.trim(); }
      var by=val('i-by'), name=val('i-name');
      if(!by || !name){ toast('Add your name and a project name'); return; }
      var idea = {id:uid(), by:by, name:name, what:val('i-what'), desc:val('i-desc'),
        solves:val('i-solves').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean),
        ai:val('i-ai'), sdg:val('i-sdg').split(/[,;]+/).map(function(x){return x.trim();}).filter(Boolean),
        elicit:val('i-elicit'), votes:[by]};
      state.ideas.push(idea);
      state.log.push({id:uid(), date:iso(today()), by:by, text:'Posted project idea: '+name});
      ideaFormOpen=false; commit('Idea posted');
    } else if(f.id==='log-form'){
      var txt = document.getElementById('log-text').value.trim();
      if(!txt){ toast('Write an update first'); return; }
      state.log.push({id:uid(), date:iso(today()), by:document.getElementById('log-by').value, text:txt});
      commit('Posted');
    }
  });

  var STEPS = [
    {t:'Welcome to your finals portal', p:'One place for the group’s project choice, deadlines, task owners, Drive links and updates. Here’s a 30-second tour.',
     d:function(){ return state.members.map(function(m){return '<span class="vote on" style="cursor:default">'+esc(m.last)+'</span>';}).join(''); }},
    {t:'Check the timeline first', p:'The top strip shows every deadline against today. Diamonds turn yellow within 7 days. Set the final presentation date at the top so the recording deadline (1 week before) appears.',
     d:function(){ return '<span class="mono">Nov 14</span> Project options <span class="mono" style="margin-left:10px">Dec 6</span> Video + deck <span class="mono" style="margin-left:10px">Dec 28</span> SRS'; }},
    {t:'Post your idea, then vote', p:'In Project, press “Add your idea” and fill in the form. Below the team’s ideas are 3 examples by Claude AI for reference. Tap your surname on any card to vote, then press “Choose this” once the group agrees.',
     d:function(){ return '<span class="vote on" style="cursor:default">Tarra</span><span class="vote" style="cursor:default">Barba</span><span class="pick" style="cursor:default">Choose this</span>'; }},
    {t:'Move your tasks along', p:'In Deliverables, click a task’s status to cycle it. Use the dropdown to change who owns it. The Team section counts how many of your tasks are done.',
     d:function(){ return '<span class="status todo">To do</span>→<span class="status doing">Doing</span>→<span class="status done">Done</span>'; }},
    {t:'Keep links in Drive & files', p:'Paste the share link for the Drive folder, SRS doc, Canva deck, Figma and videos once. Everyone opens them from here instead of searching the group chat.',
     d:function(){ return '<span class="btn ghost" style="cursor:default">Add link</span> <span style="color:var(--muted)">https://drive.google.com/…</span>'; }},
    {t:'Light or dark, your choice', p:'Use the Light, Dark or Auto switch in the sidebar (top bar on phones). Auto follows your device setting.', d:function(){ return themeSwitch(); }},
    {t:'How your changes are saved', p:'', d:function(){ return syncChip(); }}
  ];
  function savedText(){
    if(mode==='shared') return 'Changes you make here are saved for everyone who opens this page.';
    if(mode==='readonly') return 'You can view this page but not edit it. Ask Vik for edit access.';
    return 'On this site, changes are saved in your own browser only, so teammates won’t see them. Post important updates in the group chat too, and ask Vik to update the shared copy.';
  }

  function showLoader(){
    var first = true;
    try{ first = !sessionStorage.getItem('finals-portal-loaded'); sessionStorage.setItem('finals-portal-loaded','1'); }catch(e){}
    if(!first) return Promise.resolve();
    var el = document.createElement('div');
    el.className = 'loader'; el.setAttribute('role','status'); el.setAttribute('aria-label','Loading portal');
    el.innerHTML = '<div class="ld"><div class="ld-stack"><div class="ld-sheet"></div><div class="ld-sheet"></div><div class="ld-sheet"></div></div>'+
      '<div class="ld-names">'+state.members.map(function(m){return esc(m.last);}).join(' · ')+'</div>'+
      '<div class="ld-bar"><b></b></div><div class="ld-text">Opening the project binder</div></div>';
    document.body.appendChild(el);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    return new Promise(function(res){
      setTimeout(function(){ el.classList.add('hide'); setTimeout(function(){ el.remove(); res(); }, reduce?0:400); }, reduce?300:1400);
    });
  }

  function guideEl(){
    var g = document.getElementById('guide');
    if(!g){
      g = document.createElement('div'); g.id='guide'; g.className='guide'; g.hidden=true;
      g.setAttribute('role','dialog'); g.setAttribute('aria-modal','true'); g.setAttribute('aria-labelledby','g-title');
      document.body.appendChild(g);
      g.addEventListener('click', function(e){ if(e.target===g) closeGuide(); });
    }
    return g;
  }
  function drawGuide(){
    var s = STEPS[step], g = guideEl(), last = step===STEPS.length-1;
    g.innerHTML = '<div class="g-card"><div class="g-tab"><b>'+String(step+1).padStart(2,'0')+'</b> / '+String(STEPS.length).padStart(2,'0')+' &nbsp;HOW TO USE</div>'+
      '<h2 id="g-title">'+esc(s.t)+'</h2><p>'+esc(s.p || savedText())+'</p><div class="g-demo">'+s.d()+'</div>'+
      '<div class="g-foot"><div class="g-dots">'+STEPS.map(function(_,i){return '<i class="'+(i<=step?'on':'')+'"></i>';}).join('')+'</div>'+
      '<div class="g-btns">'+(last?'':'<button class="g-skip" data-g="skip">Skip tour</button>')+
      (step>0?'<button class="btn ghost" data-g="back">Back</button>':'')+
      '<button class="btn" data-g="next" id="g-next">'+(last?'Start working':'Next')+'</button></div></div></div>';
    var n = document.getElementById('g-next'); if(n) n.focus();
  }
  function openGuide(i){ lastFocus = document.activeElement; step = i||0; guideEl().hidden=false; drawGuide(); }
  function closeGuide(){ guideEl().hidden=true; try{ localStorage.setItem(GUIDE_KEY,'1'); }catch(e){} if(lastFocus && lastFocus.focus) lastFocus.focus(); }
  function guideNav(a){
    if(a==='skip') return closeGuide();
    if(a==='back'){ step=Math.max(0,step-1); return drawGuide(); }
    if(step===STEPS.length-1) return closeGuide();
    step++; drawGuide();
  }
  document.addEventListener('keydown', function(e){
    var g = document.getElementById('guide'); if(!g || g.hidden) return;
    if(e.key==='Escape') closeGuide();
    else if(e.key==='ArrowRight') guideNav('next');
    else if(e.key==='ArrowLeft') guideNav('back');
  });

  render();
  showLoader().then(function(){
    var seen = false; try{ seen = !!localStorage.getItem(GUIDE_KEY); }catch(e){}
    if(!seen) openGuide(0);
  });

  var cl = window.claude;
  if(cl && typeof cl.use==='function'){
    cl.use('artifact').then(function(a){
      if(a){ api=a; mode='shared'; }
      else { mode='local'; loadLocal(); }
      render();
    }).catch(function(){ mode='local'; loadLocal(); render(); });
  } else { mode='local'; loadLocal(); render(); }

  function loadLocal(){ try{ var s=localStorage.getItem(LS_KEY); if(s) state=JSON.parse(s); }catch(e){} }
})();
</script>
</body>
</html>
