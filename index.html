<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSANDE Finals Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout idea: an app workspace. Sidebar with views, one page at a time, Home shows your own tasks first. */
:root{
  --bg:#F6F7F9; --side:#FBFBFC; --surface:#FFFFFF; --hover:#F1F2F5; --border:#E4E6EB; --border-strong:#D3D6DD;
  --text:#191B22; --muted:#686D7A; --faint:#9A9FAB;
  --accent:#3B5BDB; --accent-soft:#EEF2FF; --accent-text:#2F4AC0;
  --green:#16A34A; --green-soft:#E8F7EE; --amber:#D97706; --amber-soft:#FEF3E2; --red:#DC2626; --red-soft:#FDECEC; --grey-soft:#F0F1F4;
  --shadow:0 1px 2px rgba(20,24,36,.05), 0 2px 8px rgba(20,24,36,.05);
  --shadow-lg:0 12px 40px rgba(20,24,36,.16), 0 2px 6px rgba(20,24,36,.08);
  --m-arradaza:#3B5BDB; --m-barba:#0F9F6E; --m-grefaldeo:#E8590C; --m-tarra:#9C36B5;
  --font:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014; --side:#121419; --surface:#171A20; --hover:#1E2129; --border:#262A33; --border-strong:#343945;
    --text:#E9EAEE; --muted:#9298A6; --faint:#6B7180;
    --accent:#7B93FF; --accent-soft:#1D2440; --accent-text:#A3B4FF;
    --green:#3DD68C; --green-soft:#12291E; --amber:#F5A524; --amber-soft:#2E2412; --red:#FF6B6B; --red-soft:#2E1517; --grey-soft:#1F232B;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
    --m-arradaza:#5C7CFA; --m-barba:#20C997; --m-grefaldeo:#FF7A2E; --m-tarra:#C25FDB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014; --side:#121419; --surface:#171A20; --hover:#1E2129; --border:#262A33; --border-strong:#343945;
  --text:#E9EAEE; --muted:#9298A6; --faint:#6B7180;
  --accent:#7B93FF; --accent-soft:#1D2440; --accent-text:#A3B4FF;
  --green:#3DD68C; --green-soft:#12291E; --amber:#F5A524; --amber-soft:#2E2412; --red:#FF6B6B; --red-soft:#2E1517; --grey-soft:#1F232B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --m-arradaza:#5C7CFA; --m-barba:#20C997; --m-grefaldeo:#FF7A2E; --m-tarra:#C25FDB;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.ic{width:17px;height:17px;flex:none}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;gap:2px;z-index:40}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.ws b{display:block;font-size:14.5px;font-weight:600}
.ws small{display:block;color:var(--muted);font-size:12.5px}
.me{margin:0 4px 12px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:flex;align-items:center;gap:9px;box-shadow:var(--shadow)}
.me select{border:0;background:transparent;flex:1;min-width:0;font-weight:500;cursor:pointer;padding:2px 0}
.me select:focus{outline:none}
.side-label{font-size:12px;color:var(--faint);padding:10px 10px 4px;font-weight:500}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav-i:hover{background:var(--hover);color:var(--text)}
.nav-i.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--border);padding:6px 9px}
.nav-i.on .ic{color:var(--accent)}
.nav-i .count{margin-left:auto;font-size:12px;color:var(--faint);background:var(--grey-soft);border-radius:10px;padding:0 7px;line-height:19px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px 4px 0}
.theme{display:flex;background:var(--grey-soft);border-radius:9px;padding:3px}
.theme button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:7px;padding:6px 4px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.theme .ic{width:15px;height:15px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:2px 6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.sync i.ok{background:var(--green)}
.link-btn{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);padding:6px 6px;border-radius:7px;cursor:pointer;font-weight:500;text-align:left}
.link-btn:hover{background:var(--hover);color:var(--text)}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:14px;padding:0 32px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top h1{font-size:17px}
.top .crumb{color:var(--faint);font-weight:500}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface);border-radius:8px;width:36px;height:36px;place-items:center;cursor:pointer}
.page{width:100%;max-width:1120px;margin:0 auto;padding:28px 32px 90px;display:flex;flex-direction:column;gap:22px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h2{font-size:15px}
.card-h a,.card-h button.text{font-size:13px;font-weight:500;color:var(--accent-text);text-decoration:none;border:0;background:none;cursor:pointer}
.card-b{padding:14px 18px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);text-decoration:none;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(59,91,219,.3), inset 0 1px 0 rgba(255,255,255,.15)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn .ic{width:16px;height:16px}
.av{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none;letter-spacing:.02em}
.av.sm{width:22px;height:22px;font-size:9px;letter-spacing:0}
.av.lg{width:44px;height:44px;font-size:15px}
.av.empty{background:var(--grey-soft);color:var(--faint);box-shadow:inset 0 0 0 1px var(--border-strong)}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 2px var(--surface)}
.stack .av+.av{margin-left:-6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12.5px;font-weight:500;border:0;cursor:pointer;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.todo{background:var(--grey-soft);color:var(--muted)}
.pill.doing{background:var(--amber-soft);color:var(--amber)}
.pill.done{background:var(--green-soft);color:var(--green)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--grey-soft);color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent-text)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.seg{display:inline-flex;background:var(--grey-soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg .n{font-size:12px;color:var(--faint)}
.bar{height:6px;border-radius:3px;background:var(--grey-soft);overflow:hidden}
.bar b{display:block;height:100%;border-radius:3px;background:var(--green)}
.muted{color:var(--muted)}
.empty-state{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-state .ic{width:28px;height:28px;color:var(--faint)}

/* home */
.hello{display:grid;grid-template-columns:minmax(0,1fr) 260px;overflow:hidden}
.hello-main{padding:26px 26px 24px}
.hello h2{font-size:26px;letter-spacing:-.02em}
.hello p{margin:6px 0 18px;color:var(--muted);font-size:15px;max-width:52ch}
.hello-actions{display:flex;gap:8px;flex-wrap:wrap}
.count-down{background:var(--accent);color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;position:relative;overflow:hidden}
.count-down::after{content:"";position:absolute;right:-40px;bottom:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.1)}
.count-down small{opacity:.85;font-weight:500}
.count-down .big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count-down .big span{font-size:18px;font-weight:500;letter-spacing:0;margin-left:4px;opacity:.9}
.count-down b{font-weight:600;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.stat .k{color:var(--muted);font-weight:500;font-size:13px;display:flex;align-items:center;gap:7px}
.stat .k .ic{width:15px;height:15px}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13.5px;color:var(--muted);font-weight:500;letter-spacing:0}
.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:20px 18px 18px;position:relative}
.step{display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;padding-right:10px;text-decoration:none;color:var(--text)}
.step::before{content:"";position:absolute;top:13px;left:28px;right:0;height:2px;background:var(--border)}
.step:last-child::before{display:none}
.step.past::before{background:var(--green)}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--border-strong);font-size:11.5px;font-weight:600;color:var(--muted);position:relative;z-index:1}
.step.past .node{background:var(--green);border-color:var(--green);color:#fff}
.step.now .node{border-color:var(--accent);color:var(--accent-text);box-shadow:0 0 0 4px var(--accent-soft)}
.step .s-txt{display:flex;flex-direction:column;gap:2px}
.step b{font-size:13.5px;font-weight:600;line-height:1.25}
.step small{color:var(--muted);font-size:12.5px}
.step small.soon{color:var(--red);font-weight:500}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li:hover{background:var(--hover)}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:500;display:block}
.li .t small{color:var(--muted);font-size:12.5px}
.li.done .t b{color:var(--faint);text-decoration:line-through}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:#fff;padding:0}
.check.doing{border-color:var(--amber);background:linear-gradient(90deg,var(--amber) 50%,transparent 50%)}
.check.done{background:var(--green);border-color:var(--green)}
.check .ic{width:13px;height:13px}
.feed .li{align-items:flex-start}
.feed .t small{display:block}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:13px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}

/* tasks */
.group-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.group-h h2{font-size:15px}
.group-h .muted{font-size:13px}
.group-h .bar{width:90px;margin-left:auto}
.group-note{margin:0;padding:10px 18px;background:var(--amber-soft);color:var(--amber);font-size:13px;border-bottom:1px solid var(--border)}
.group-note strong{font-weight:600}
.trow{display:grid;grid-template-columns:24px minmax(0,1fr) 120px 150px;gap:12px;align-items:center;padding:9px 18px;border-top:1px solid var(--border)}
.group .trow:first-of-type{border-top:0}
.trow:hover{background:var(--hover)}
.trow.done .tt{color:var(--faint);text-decoration:line-through}
.owner{display:flex;align-items:center;gap:7px;min-width:0}
.owner select{border:0;background:transparent;color:var(--muted);cursor:pointer;min-width:0;flex:1;padding:2px 0}
.owner select:hover{color:var(--text)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--grey-soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:600}
.col-h .n{color:var(--faint);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.kc .kt{font-weight:500;line-height:1.35}
.kc .kf{display:flex;align-items:center;gap:8px}
.kc .kf .pill{margin-left:auto}

/* ideas */
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.idea{display:flex;flex-direction:column;gap:12px;padding:18px;position:relative}
.idea.chosen{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
.idea-top{display:flex;align-items:flex-start;gap:12px}
.idea-top h3{font-size:17px}
.idea-top small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.idea-top .tag{margin-left:auto}
.idea p{margin:0;color:var(--muted)}
.facts{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.fact{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px}
.fact > span:first-child{color:var(--faint);font-weight:500}
.fact ul{margin:0;padding-left:16px}
.sdgs{display:flex;gap:5px;flex-wrap:wrap}
.idea-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.voters{display:flex;gap:4px}
.vote{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--border-strong);background:transparent;color:var(--faint);font-size:10.5px;font-weight:600;cursor:pointer;display:grid;place-items:center;padding:0}
.vote:hover{border-color:var(--c);color:var(--c)}
.vote[aria-pressed="true"]{background:var(--c);border:1.5px solid var(--c);color:#fff}
.idea-foot .vc{color:var(--muted);font-size:12.5px}
.idea-foot .right{margin-left:auto;display:flex;gap:6px}
.claude-note{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--accent-soft);color:var(--accent-text);border-radius:12px;font-size:13.5px}
.claude-note .ic{width:20px;height:20px}

/* files */
.frow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--border)}
.frow:first-child{border-top:0}
.frow:hover{background:var(--hover)}
.ficon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--fbg);color:var(--fc)}
.ficon .ic{width:19px;height:19px}
.frow b{font-weight:500;display:block}
.frow small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .acts{display:flex;gap:6px}
.frow form{grid-column:2/-1;display:flex;gap:8px}
.input{height:36px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);padding:0 11px;min-width:0;flex:1}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* team */
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mem{padding:18px;display:flex;flex-direction:column;gap:14px}
.mem-top{display:flex;align-items:center;gap:12px}
.mem-top b{display:block;font-size:16px;font-weight:600}
.mem-top small{color:var(--muted)}
.mem label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--faint);font-weight:500}
.mem input{border:1px solid transparent;border-radius:8px;padding:6px 8px;margin:0 -8px;background:transparent;font-size:14px;color:var(--text)}
.mem input:hover{border-color:var(--border)}
.mem input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.mem-prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.mem-prog .bar{flex:1}

/* rules */
.grade{display:flex;flex-direction:column;gap:16px}
.gbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px}
.gbar i{display:block;height:100%}
.gleg{display:flex;flex-direction:column;gap:10px}
.gleg div{display:flex;align-items:center;gap:10px}
.gleg i{width:10px;height:10px;border-radius:3px}
.gleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.rule{display:flex;gap:14px;padding:13px 18px;border-top:1px solid var(--border);align-items:flex-start}
.rule:first-child{border-top:0}
.rule .ri{width:34px;height:34px;border-radius:9px;background:var(--grey-soft);display:grid;place-items:center;color:var(--muted);flex:none}
.rule b{display:block;font-weight:600}
.rule span{color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}

/* composer */
.composer{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);align-items:center}
.composer select{height:36px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);padding:0 8px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,12,18,.45);display:grid;place-items:center;padding:16px;animation:fade .15s ease}
.modal[hidden]{display:none}
.sheet{width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.sheet-h h2{font-size:17px}
.sheet-b{padding:18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sheet-b label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13.5px}
.sheet-b label small{color:var(--faint);font-weight:400}
.sheet-b .wide{grid-column:1/-1}
.sheet-b input,.sheet-b select,.sheet-b textarea{border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);padding:8px 11px;font-size:14px;resize:vertical}
.sheet-b input:focus,.sheet-b select:focus,.sheet-b textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sheet-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--side);border-radius:0 0 16px 16px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}

/* guide */
.g-card{width:min(480px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease}
.g-art{height:150px;background:var(--accent);display:grid;place-items:center;position:relative;overflow:hidden}
.g-art::before,.g-art::after{content:"";position:absolute;border-radius:50%;border:24px solid rgba(255,255,255,.09)}
.g-art::before{width:220px;height:220px;left:-60px;top:-90px}
.g-art::after{width:160px;height:160px;right:-40px;bottom:-70px}
.g-art .demo{position:relative;z-index:1;background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:85%;color:var(--text)}
.g-body{padding:20px 22px 8px}
.g-body small{color:var(--accent-text);font-weight:600;font-size:12.5px}
.g-body h2{font-size:20px;margin:4px 0 8px}
.g-body p{margin:0;color:var(--muted)}
.g-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 20px}
.g-dots{display:flex;gap:5px}
.g-dots i{width:6px;height:6px;border-radius:3px;background:var(--border-strong);transition:width .2s}
.g-dots i.on{width:18px;background:var(--accent)}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{width:0}}
@keyframes popk{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(-18px,-14px) rotate(25deg)}}
@keyframes tick{from{transform:scale(.3);opacity:0}}
.page.enter > *{animation:rise .5s cubic-bezier(.2,.75,.25,1) both}
.page.enter > *:nth-child(2){animation-delay:.06s}
.page.enter > *:nth-child(3){animation-delay:.12s}
.page.enter > *:nth-child(4){animation-delay:.18s}
.page.enter > *:nth-child(5){animation-delay:.24s}
.page.enter > *:nth-child(n+6){animation-delay:.3s}
.page.enter .ideas-grid > *,.page.enter .team > *,.page.enter .col .kc,.page.enter .frow,.page.enter .rule{animation:rise .45s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(.12s + var(--i,0) * 45ms)}
.page.enter .bar b,.page.enter .gbar i{animation:grow .9s .25s cubic-bezier(.2,.75,.25,1) both}
.pop{animation:popk .35s ease}
.check.done .ic{animation:tick .25s ease}
.step.now .node{animation:ring 2s ease-out infinite}
.count-down::after{animation:drift 9s ease-in-out infinite alternate}
.card.idea,.card.stat,.card.mem,.kc{transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.card.idea:hover,.card.stat:hover,.card.mem:hover,.kc:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,24,36,.1),0 1px 3px rgba(20,24,36,.06)}
.nav-i,.chip,.seg button,.btn,.pill,.vote,.check{transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s,transform .12s}
.btn:active,.chip:active,.vote:active,.check:active,.pill:active{transform:scale(.96)}
.li,.trow,.frow{transition:background-color .15s}

/* loader */
.loader{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;transition:opacity .3s}
.loader.hide{opacity:0;pointer-events:none}
.ld{display:flex;flex-direction:column;align-items:center;gap:18px}
.ld h2{font-size:20px;animation:rise .5s .15s both}
.ld .avs{display:flex;gap:8px}
.ld .avs .av{width:38px;height:38px;font-size:13px;animation:rise .45s cubic-bezier(.2,.8,.3,1.4) both}
.ld .avs .av:nth-child(1){animation-delay:.25s}.ld .avs .av:nth-child(2){animation-delay:.35s}.ld .avs .av:nth-child(3){animation-delay:.45s}.ld .avs .av:nth-child(4){animation-delay:.55s}
.ld .track.det b{width:0;animation:fillup 1.5s .2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fillup{to{width:100%}}
.ld .msg{min-height:20px}
.ld .logo{width:52px;height:52px;border-radius:14px;font-size:22px;animation:breathe 1.2s ease-in-out infinite}
.ld .track{width:160px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.ld .track b{display:block;height:100%;width:40%;background:var(--accent);border-radius:2px;animation:slide 1s ease-in-out infinite}
.ld .msg{color:var(--muted);font-size:13px}
@keyframes breathe{50%{transform:scale(.94)}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:95;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media (max-width:1000px){
  .home-grid,.two{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;gap:4px}
  .step{flex-direction:row;align-items:center;gap:12px;padding:6px 0}
  .step::before{display:none}
  .step .s-txt{display:flex;flex-direction:column}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,12,18,.4);z-index:35}
  .menu-btn{display:grid}
  .top{padding:0 16px}
  .page{padding:18px 16px 80px}
  .hello{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:1/-1}
  .board{grid-template-columns:1fr}
  .team{grid-template-columns:1fr}
  .trow{grid-template-columns:24px minmax(0,1fr) auto}
  .trow .owner{grid-column:2/-1;grid-row:2}
  .sheet-b{grid-template-columns:1fr}
  .top-actions .hide-sm{display:none}
  .composer{flex-wrap:wrap}
}

  }
  function updatesView(){
    return '<div class="card"><form class="composer" id="log-form">'+(me?av(me):'<span class="av empty">?</span>')+'<select id="log-by" aria-label="Posting as"><option value="">Posting as…</option>'+state.members.map(function(m){return '<option value="'+m.id+'"'+(m.id===me?' selected':'')+'>'+esc(m.first)+'</option>';}).join('')+'</select><input class="input" id="log-text" placeholder="Share an update or decision" aria-label="Update"><button class="btn primary" type="submit">'+ic('send')+'Post</button></form>'+
      '<div class="list feed">'+(state.log.length?state.log.slice().reverse().map(function(e){ return feedLine(e).replace('</div></div>','</div><button class="btn sm ghost" data-dellog="'+e.id+'" aria-label="Delete update" title="Delete">'+ic('trash')+'</button></div>'); }).join(''):'<div class="empty-state">No updates yet.</div>')+'</div></div>';
  }

  /* ---------- modal: new idea ---------- */
  function openIdea(){
    var mo=document.createElement('div'); mo.className='modal'; mo.id='idea-modal';
    mo.innerHTML='<form class="sheet" id="idea-form" role="dialog" aria-modal="true" aria-labelledby="im-t"><div class="sheet-h"><h2 id="im-t">New project idea</h2><button type="button" class="btn sm ghost" data-closemodal="1" aria-label="Close">'+ic('x')+'</button></div><div class="sheet-b">'+
      '<label for="i-by">Your name<select id="i-by" required><option value="">Choose</option>'+state.members.map(function(m){return '<option value="'+m.id+'"'+(m.id===me?' selected':'')+'>'+esc(m.first+' '+m.last)+'</option>';}).join('')+'</select></label>'+
      '<label for="i-name">Project name<input id="i-name" maxlength="40" placeholder="BantayBaha" required></label>'+
      '<label class="wide" for="i-what">One-line summary<input id="i-what" maxlength="70" placeholder="AI flood alerts for barangays"></label>'+
      '<label class="wide" for="i-desc">What it does<textarea id="i-desc" rows="3" placeholder="Who uses it and what they do with it"></textarea></label>'+
      '<label class="wide" for="i-solves">Problems it solves <small>One per line</small><textarea id="i-solves" rows="3"></textarea></label>'+
      '<label for="i-ai">AI and analytics<input id="i-ai" placeholder="Forecasting, image recognition"></label>'+
      '<label for="i-sdg">SDG<input id="i-sdg" placeholder="SDG 3, SDG 11"></label>'+
      '<label class="wide" for="i-elicit">Elicitation so far <small>Optional</small><input id="i-elicit" placeholder="Interviewed 3 tricycle drivers"></label>'+
      '</div><div class="sheet-f"><button type="button" class="btn" data-closemodal="1">Cancel</button><button type="submit" class="btn primary">'+ic('send')+'Post idea</button></div></form>';
    document.body.appendChild(mo);
    mo.addEventListener('mousedown',function(e){ if(e.target===mo) closeModal(); });
    var f=document.getElementById(me?'i-name':'i-by'); if(f) f.focus();
  }
  function closeModal(){ var m=document.getElementById('idea-modal'); if(m) m.remove(); }

  /* ---------- saving ---------- */
  function commit(msg){ var y=window.scrollY; render(); window.scrollTo(0,y);
    if(mode==='readonly'){ toast('View only. Change not saved'); return; }
    if(mode!=='shared'){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} if(msg) toast(msg); return; }
    clearTimeout(timer); timer=setTimeout(publish,900); if(msg) toast(msg); }
  function buildDoc(){
    var json=JSON.stringify(state).replace(/</g,'\\u003c');
    var head='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>SYSANDE Finals Portal</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+document.getElementById('app-fonts').outerHTML+'\n'+document.getElementById('app-style').outerHTML;
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+head+'\n</head>\n<body>\n<script type="application/json" id="portal-state">'+json+'<\/script>\n<div id="app"></div>\n<div class="toast" id="toast" role="status" aria-live="polite"></div>\n'+SELF.outerHTML+'\n</body>\n</html>';
  }
  function publish(){ if(!api) return; api.publish(buildDoc()).catch(function(err){ var c=(err&&(err.code||err.name||err.message))||''; if(/not_granted|not_writer/.test(c)){ mode='readonly'; render(); toast('View only. Change not saved'); } else if(!/conflict/.test(c)) toast('Couldn’t save. Try again'); }); }
  var tT; function toast(t){ var el=document.getElementById('toast'); if(!el) return; el.innerHTML=ic('check')+esc(t); el.classList.add('show'); clearTimeout(tT); tT=setTimeout(function(){el.classList.remove('show');},1800); }
  function re(fn){ var y=window.scrollY; fn(); render(); window.scrollTo(0,y); }

  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-goto-group]'); if(a){ ui.taskFilter=a.dataset.gotoGroup; }
    var b=e.target.closest('button,[data-menu]'); if(!b) return; var d=b.dataset;
    if(d.status){ popKey='[data-status="'+d.status+'"]'; var it=findItem(d.status); it.status=STATUSES[(STATUSES.indexOf(it.status)+1)%3]; commit(it.status==='done'?'Marked done':''); }
    else if(d.vote){ popKey='[data-vote="'+d.vote+'"][data-m="'+d.m+'"]'; var o=findProject(d.vote), i=o.votes.indexOf(d.m); if(i>-1) o.votes.splice(i,1); else o.votes.push(d.m); commit(); }
    else if(d.pick){ popKey='[data-pick="'+d.pick+'"]'; state.chosen=state.chosen===d.pick?'':d.pick; commit(state.chosen?'Project chosen':'Choice cleared'); }
    else if(d.newidea){ openIdea(); }
    else if(d.closemodal){ closeModal(); }
    else if(d.delidea){ state.ideas=state.ideas.filter(function(x){return x.id!==d.delidea;}); if(state.chosen===d.delidea) state.chosen=''; commit('Idea removed'); }
    else if(d.itab){ re(function(){ ui.ideaTab=d.itab; }); }
    else if(d.tfilter){ re(function(){ ui.taskFilter=d.tfilter; }); }
    else if(d.tview){ re(function(){ ui.taskView=d.tview; }); }
    else if(d.editlink){ re(function(){ ui.editingLink=d.editlink; }); var inp=document.getElementById('link-'+d.editlink); if(inp) inp.focus(); }
    else if(d.cancel){ re(function(){ ui.editingLink=null; }); }
    else if(d.dellog){ state.log=state.log.filter(function(x){return x.id!==d.dellog;}); commit('Update deleted'); }
    else if(d.menu){ re(function(){ ui.menu=d.menu==='1'; }); }
    else if(d.themeSet){ themePref=d.themeSet; try{ localStorage.setItem(TK,themePref); }catch(err){} applyTheme(); document.querySelectorAll('[data-theme-set]').forEach(function(x){ x.setAttribute('aria-pressed',String(x.dataset.themeSet===themePref)); }); }
    else if(d.guide){ openGuide(0); }
    else if(d.g){ guideNav(d.g); }
  });
  document.addEventListener('change',function(e){
    var el=e.target, d=el.dataset;
    if(el.id==='f-final'){ state.finalDate=el.value; commit('Presentation date set'); }
    else if(el.id==='me-select'){ me=el.value; try{ localStorage.setItem('sysande-me',me); }catch(err){} re(function(){}); if(me) toast('Hi, '+member(me).first); }
    else if(d.owner){ findItem(d.owner).owner=el.value; commit(); }
    else if(d.mrole){ member(d.mrole).role=el.value.trim(); commit('Role saved'); }
    else if(d.mfocus){ member(d.mfocus).focus=el.value.trim(); commit('Saved'); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closeModal();
    if(e.key==='Enter'&&e.target.matches('.mem input')){ e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('submit',function(e){
    e.preventDefault(); var f=e.target;
    if(f.dataset.linkform){ var v=document.getElementById('link-'+f.dataset.linkform).value.trim(); if(v&&!/^https?:\/\//i.test(v)) v='https://'+v; state.links.forEach(function(k){ if(k.id===f.dataset.linkform) k.url=v; }); ui.editingLink=null; commit(v?'Link saved':'Link removed'); }
    else if(f.id==='idea-form'){
      function val(id){ return document.getElementById(id).value.trim(); }
      var by=val('i-by'), name=val('i-name'); if(!by||!name){ toast('Add your name and a project name'); return; }
      state.ideas.push({id:uid(),by:by,name:name,what:val('i-what'),desc:val('i-desc'),solves:val('i-solves').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean),ai:val('i-ai'),sdg:val('i-sdg').split(/[,;]+/).map(function(x){return x.trim();}).filter(Boolean),elicit:val('i-elicit'),votes:[by]});
      state.log.push({id:uid(),date:iso(today()),by:by,text:'Posted a project idea: '+name});
      closeModal(); ui.ideaTab='team'; commit('Idea posted');
    } else if(f.id==='log-form'){ var t=document.getElementById('log-text').value.trim(); if(!t){ toast('Write an update first'); return; } state.log.push({id:uid(),date:iso(today()),by:document.getElementById('log-by').value,text:t}); commit('Update posted'); }
  });

  /* ---------- loader + guide ---------- */
  var GK='sysande-portal-guide-v3', step=0, lastFocus=null;
  var STEPS=[
    {t:'Welcome to the SYSANDE portal',p:'Everything for our finals in one place: ideas, tasks, deadlines and files. This takes 30 seconds.',d:function(){ return '<div class="stack">'+state.members.map(function(m){return av(m.id);}).join('')+'</div><b>Arradaza, Barba, Grefaldeo, Tarra</b>'; }},
    {t:'Tell the portal who you are',p:'Pick your name at the top of the sidebar. Home will then show your own tasks first.',d:function(){ return '<span class="av sm empty">?</span><b>Who are you?</b>'; }},
    {t:'Post ideas and support them',p:'Go to Ideas and press New idea. Tap your initials on an idea to support it. When we agree, press Choose. Claude AI’s examples have their own tab.',d:function(){ return '<span class="btn primary sm">'+ic('plus')+'New idea</span><button class="vote" style="--c:var(--m-tarra)" aria-pressed="true">VT</button>'; }},
    {t:'Update your tasks',p:'Click a task’s checkbox or status to move it from To do, to In progress, to Done. Switch to Board view to see everything at a glance.',d:function(){ return '<span class="pill todo">To do</span><span class="pill doing">In progress</span><span class="pill done">Done</span>'; }},
    {t:'Light or dark',p:'Switch themes at the bottom of the sidebar. Auto follows your device.',d:function(){ return themeSwitch(); }},
    {t:'How saving works',p:'',d:function(){ return '<span class="sync" style="padding:0">'+syncText()+'</span>'; }}
  ];
  function savedText(){ if(mode==='shared') return 'Changes you make here are saved for the whole group.'; if(mode==='readonly') return 'You can view this page but changes won’t save. Ask Vik for edit access.'; return 'On this site, your changes are saved in your own browser only. Share important updates in the group chat too.'; }
  function showLoader(){
    var recent=false; try{ var lt=+sessionStorage.getItem('sysande-loaded-at')||0; recent=Date.now()-lt<20000; sessionStorage.setItem('sysande-loaded-at',String(Date.now())); }catch(e){}
    if(recent) return Promise.resolve();
    var el=document.createElement('div'); el.className='loader'; el.setAttribute('role','status'); el.setAttribute('aria-label','Loading the portal');
    el.innerHTML='<div class="ld"><div class="logo">S</div><h2>SYSANDE Finals</h2><div class="avs">'+state.members.map(function(m){return av(m.id);}).join('')+'</div><div class="track det"><b></b></div><span class="msg" id="ld-msg">Loading tasks</span></div>';
    document.body.appendChild(el);
    var msgs=['Loading tasks','Loading project ideas','Checking deadlines','Almost ready'], k=0;
    var iv=setInterval(function(){ k=Math.min(k+1,msgs.length-1); var m=document.getElementById('ld-msg'); if(m) m.textContent=msgs[k]; },380);
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    return new Promise(function(r){ setTimeout(function(){ clearInterval(iv); el.classList.add('hide'); setTimeout(function(){ el.remove(); r(); },300); }, reduce?300:1700); });
  }
  function gEl(){ var g=document.getElementById('guide'); if(!g){ g=document.createElement('div'); g.id='guide'; g.className='modal'; g.hidden=true; document.body.appendChild(g); g.addEventListener('mousedown',function(e){ if(e.target===g) closeGuide(); }); } return g; }
  function drawGuide(){ var s=STEPS[step], last=step===STEPS.length-1;
    gEl().innerHTML='<div class="g-card" role="dialog" aria-modal="true" aria-labelledby="g-t"><div class="g-art"><div class="demo">'+s.d()+'</div></div><div class="g-body"><small>Step '+(step+1)+' of '+STEPS.length+'</small><h2 id="g-t">'+esc(s.t)+'</h2><p>'+esc(s.p||savedText())+'</p></div>'+
      '<div class="g-foot"><div class="g-dots">'+STEPS.map(function(_,i){return '<i class="'+(i===step?'on':'')+'"></i>';}).join('')+'</div><div style="display:flex;gap:8px">'+(last?'':'<button class="btn ghost" data-g="skip">Skip</button>')+(step?'<button class="btn" data-g="back">Back</button>':'')+'<button class="btn primary" data-g="next" id="g-next">'+(last?'Get started':'Next')+'</button></div></div></div>';
    var n=document.getElementById('g-next'); if(n) n.focus(); }
  function openGuide(i){ lastFocus=document.activeElement; step=i||0; gEl().hidden=false; drawGuide(); }
  function closeGuide(){ gEl().hidden=true; try{ localStorage.setItem(GK,'1'); }catch(e){} if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
  function guideNav(a){ if(a==='skip') return closeGuide(); if(a==='back'){ step=Math.max(0,step-1); return drawGuide(); } if(step===STEPS.length-1) return closeGuide(); step++; drawGuide(); }
  document.addEventListener('keydown',function(e){ var g=document.getElementById('guide'); if(!g||g.hidden) return; if(e.key==='Escape') closeGuide(); else if(e.key==='ArrowRight') guideNav('next'); else if(e.key==='ArrowLeft') guideNav('back'); });

  render();
  showLoader().then(function(){ lastView=null; render(); var s=false; try{ s=!!localStorage.getItem(GK); }catch(e){} if(!s) openGuide(0); });
  function loadLocal(){ try{ var s=localStorage.getItem(LS_KEY); if(s){ state=JSON.parse(s); if(!state.ideas) state.ideas=[]; } }catch(e){} }
  var cl=window.claude;
  if(cl&&typeof cl.use==='function'){ cl.use('artifact').then(function(a){ if(a){ api=a; mode='shared'; } else { mode='local'; loadLocal(); } render(); }).catch(function(){ mode='local'; loadLocal(); render(); }); }
  else { mode='local'; loadLocal(); render(); }
})();
</script>
</body>
</html>
