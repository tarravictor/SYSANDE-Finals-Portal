<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSANDE Finals Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style id="app-style">
/* Layout idea: the portal drawn in SYSANDE notation. Context diagram up top, deadlines as processes P1–P5, files as data stores D1–D8, members as external entities. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#172033; --soft:#596273; --line:#C9CFCA; --line-soft:#E1E5E0;
  --blue:#2F5BEA; --wash:#E3E9FD; --due:#C2410C; --ok:#15855F; --doing:#B7791F;
  --m-arradaza:#2F5BEA; --m-barba:#15855F; --m-grefaldeo:#D9601E; --m-tarra:#8547D0;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121827; --surface:#1A2234; --ink:#E7EBF3; --soft:#9CA6B8; --line:#34405A; --line-soft:#263049;
    --blue:#86A2FF; --wash:#25315A; --due:#FF8D57; --ok:#4CCB97; --doing:#E9B04F;
    --m-arradaza:#86A2FF; --m-barba:#4CCB97; --m-grefaldeo:#FF9655; --m-tarra:#B98CFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121827; --surface:#1A2234; --ink:#E7EBF3; --soft:#9CA6B8; --line:#34405A; --line-soft:#263049;
  --blue:#86A2FF; --wash:#25315A; --due:#FF8D57; --ok:#4CCB97; --doing:#E9B04F;
  --m-arradaza:#86A2FF; --m-barba:#4CCB97; --m-grefaldeo:#FF9655; --m-tarra:#B98CFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.ic{width:18px;height:18px;flex:none}

/* top bar */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--ink)}
.bar-in{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:28px}
.mark{font:800 19px/1 var(--display);font-stretch:118%;letter-spacing:-.01em;text-decoration:none;color:var(--ink);white-space:nowrap}
.mark span{font-weight:500;font-stretch:100%;color:var(--soft)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 10px;text-decoration:none;color:var(--soft);font-weight:700;font-size:14.5px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-bottom-color:var(--blue)}
.tools{display:flex;align-items:center;gap:10px}
.mode{display:flex;border:1.5px solid var(--ink);border-radius:20px;overflow:hidden}
.mode button{border:0;background:transparent;padding:5px 9px;cursor:pointer;display:grid;place-items:center;color:var(--soft)}
.mode button+button{border-left:1.5px solid var(--ink)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mode .ic{width:16px;height:16px}
.guide-btn{border:1.5px solid var(--ink);background:transparent;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.guide-btn:hover{background:var(--ink);color:var(--bg)}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;padding:56px 0 48px}
.hero h1{font-size:clamp(40px,6vw,76px);line-height:.95;font-weight:800;font-stretch:122%;letter-spacing:-.025em}
.lede{font-size:19px;color:var(--soft);max-width:34ch;margin:22px 0 0}
.lede strong{color:var(--ink)}
.lede .late{color:var(--due);font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:28px}
.facts label{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--soft)}
.facts input{border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:4px 0;font-weight:700;font-size:16px;color:var(--ink);min-width:150px}
.facts input:focus{outline:none;border-bottom-color:var(--blue)}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--soft);margin-top:22px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--doing)}
.sync i.ok{background:var(--ok)}

.ctx{width:100%;height:auto;overflow:visible}
.ctx .ent{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.ctx .proc{fill:var(--wash);stroke:var(--ink);stroke-width:2}
.ctx .flow{fill:none;stroke:var(--ink);stroke-width:1.6}
.ctx .t-ent{font:800 15px var(--display);font-stretch:112%;fill:var(--ink)}
.ctx .t-sub{font:400 12px var(--body);fill:var(--soft)}
.ctx .t-flow{font:700 11.5px var(--body);fill:var(--soft);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.ctx .t-proc{font:800 20px var(--display);font-stretch:115%;fill:var(--ink)}
.ctx .t-pid{font:700 12px var(--body);fill:var(--soft)}
.ctx .chip{stroke:none}
.ctx .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* sections */
.sec{padding:56px 0;border-top:1.5px solid var(--ink);scroll-margin-top:64px}
.sec-head{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;margin-bottom:28px;align-items:end}
.sec-head h2{font-size:clamp(28px,3.4vw,40px);line-height:1;font-weight:800;font-stretch:118%;letter-spacing:-.015em}
.sec-head p{margin:0;color:var(--soft);max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:22px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn .ic{width:16px;height:16px}

/* process chain */
.chain{display:flex;align-items:stretch;overflow-x:auto;padding:6px 2px 14px}
.p{flex:1 0 190px;max-width:240px;background:var(--surface);border:2px solid var(--ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.p:hover{box-shadow:4px 4px 0 var(--ink)}
.p-top{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:2px solid var(--ink);font-weight:700;font-size:13.5px}
.p.past{opacity:.6}
.p.soon .p-top{background:var(--due);color:#fff}
.p-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.p-body h3{font-size:18px;line-height:1.15;font-weight:800;font-stretch:108%}
.p-left{font-size:14px;color:var(--soft);margin-top:auto}
.p-left b{color:var(--ink)}
.p.soon .p-left b{color:var(--due)}
.track{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.track b{display:block;height:100%;background:var(--ok)}
.arrow{flex:0 0 40px;align-self:center;color:var(--ink)}
.arrow svg{width:40px;height:16px;display:block}

/* ideas */
.idea-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;padding:24px;border:2px solid var(--ink);border-radius:16px;background:var(--surface);margin-bottom:28px}
.idea-form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.idea-form label small{font-weight:400;color:var(--soft)}
.idea-form .wide{grid-column:1/-1}
.idea-form input,.idea-form select,.idea-form textarea{border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);font-size:15px;resize:vertical}
.idea-form input:focus,.idea-form select:focus,.idea-form textarea:focus{outline:none;border-color:var(--blue)}
.form-end{display:flex;gap:10px;justify-content:flex-end}
.ideas{display:flex;flex-direction:column}
.idea{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 190px;gap:28px;padding:24px 0;border-bottom:1.5px solid var(--line)}
.idea:first-child{border-top:1.5px solid var(--line)}
.idea.chosen{background:linear-gradient(90deg,var(--wash),transparent 70%);margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:12px;border-color:transparent}
.idea h3{font-size:26px;line-height:1.05;font-weight:800;font-stretch:115%}
.idea .who{font-size:14px;color:var(--soft);margin-top:8px;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.idea .sum{font-weight:700;margin:0 0 6px}
.idea p{margin:0 0 10px;color:var(--soft)}
.idea dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.idea dt{font-weight:700}
.idea dd{margin:0;color:var(--soft)}
.idea ul{margin:0;padding-left:18px}
.decide{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.voters{display:flex;gap:6px}
.vt{width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:transparent;color:var(--c);font:800 12px var(--display);cursor:pointer;display:grid;place-items:center}
.vt[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.tally{font-size:14px;color:var(--soft)}
.pick{border:1.5px solid var(--ink);background:transparent;border-radius:22px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.pick:hover{background:var(--ink);color:var(--bg)}
.idea.chosen .pick{background:var(--blue);border-color:var(--blue);color:#fff}
.pick .ic{width:16px;height:16px}
.del{border:0;background:transparent;color:var(--soft);font-size:13.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.del:hover{color:var(--due)}
.none{padding:28px;border:2px dashed var(--line);border-radius:16px;color:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.examples{margin-top:44px;padding-left:22px;border-left:4px dotted var(--line)}
.examples > h3{font-size:20px;font-weight:800;font-stretch:112%;display:flex;align-items:center;gap:10px}
.examples > p{margin:6px 0 12px;color:var(--soft);max-width:62ch}
.examples .idea h3{font-size:22px}

/* tasks */
.group{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;padding:22px 0;border-bottom:1.5px solid var(--line)}
.group:last-child{border-bottom:0}
.g-id{display:flex;gap:14px;align-items:flex-start}
.g-pid{flex:none;width:46px;height:46px;border:2px solid var(--ink);border-radius:12px;display:grid;place-items:center;font:800 15px var(--display);font-stretch:110%}
.g-id h3{font-size:20px;font-weight:800;font-stretch:110%;line-height:1.15}
.g-id .when{font-size:14px;color:var(--soft);margin-top:3px}
.g-id .when b{color:var(--ink)}
.g-id .when b.late{color:var(--due)}
.g-note{font-size:14px;color:var(--soft);margin:10px 0 0 60px}
.g-note strong{color:var(--due)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row .txt{font-size:15.5px}
.row.done .txt{color:var(--soft);text-decoration:line-through;text-decoration-thickness:1px}
.st{width:28px;height:28px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--ink)}
.st svg{width:28px;height:28px;display:block}
.st.doing{color:var(--doing)} .st.done{color:var(--ok)}
.own{display:flex;align-items:center;gap:8px}
.own select{border:0;background:transparent;font-size:14.5px;color:var(--soft);padding:2px 0;cursor:pointer;width:100%}
.own select:hover{color:var(--ink)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend svg{width:18px;height:18px}

/* team */
.ents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ent{border:2px solid var(--ink);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:6px;position:relative}
.ent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.ent h3{font-size:22px;font-weight:800;font-stretch:118%;line-height:1}
.ent .fn{color:var(--soft);font-size:14.5px;margin-bottom:6px}
.ent input{border:0;border-bottom:1.5px dashed transparent;background:transparent;padding:2px 0;width:100%}
.ent input:hover{border-bottom-color:var(--line)}
.ent input:focus{outline:none;border-bottom-color:var(--blue)}
.ent .role{font-weight:700;color:var(--c)}
.ent .focus{font-size:14.5px;color:var(--soft)}
.ent .load{font-size:13.5px;color:var(--soft);margin-top:auto;padding-top:10px}

/* data stores */
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
.ds{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:stretch;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);min-height:62px}
.ds-id{border-left:2px solid var(--ink);border-right:2px solid var(--ink);display:grid;place-items:center;font:800 15px var(--display);font-stretch:110%}
.ds.set .ds-id{background:var(--ink);color:var(--bg)}
.ds-main{padding:8px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ds-main b{font-size:15.5px}
.ds-main span{font-size:13.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-act{display:flex;align-items:center;gap:6px;padding-right:2px}
.ds-act a,.ds-act button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:transparent;border-radius:18px;padding:5px 12px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.ds-act a:hover,.ds-act button:hover{background:var(--ink);color:var(--bg)}
.ds-act .ic{width:15px;height:15px}
.ds-act .quiet{border-color:transparent;padding:5px 8px}
.ds form{grid-column:1/-1;display:flex;gap:8px;padding:10px 0 10px 70px;border-top:1.5px dashed var(--line)}
.ds form input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:14px}

/* rules */
.rules-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
.rules{margin:0;padding:0;list-style:none}
.rules li{padding:12px 0;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:120px 1fr;gap:16px}
.rules li b{font-family:var(--display);font-stretch:110%}
.weights{display:flex;flex-direction:column;gap:14px}
.w{display:grid;grid-template-columns:1fr 64px;gap:8px 12px;align-items:end}
.w span{font-size:15px}
.w strong{font:800 30px/1 var(--display);font-stretch:115%;text-align:right}
.w .track{grid-column:1/-1;height:12px;border-radius:6px}
.w .track b{background:var(--ink)}
.w.group-work .track b{background:var(--blue)}
.w-note{font-size:14px;color:var(--soft);margin:4px 0 0}

/* log */
.log-form{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:10px;margin-bottom:18px}
.log-form select,.log-form input{border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);font-size:15px}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:90px 130px minmax(0,1fr) 30px;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
.log .d{color:var(--soft);font-size:14px}
.log .w2{font-weight:700;display:flex;align-items:center;gap:7px}
.log .x{border:0;background:transparent;color:var(--soft);cursor:pointer;padding:0}
.log .x:hover{color:var(--due)}
.log .x .ic{width:16px;height:16px}
footer{padding:36px 0 60px;color:var(--soft);font-size:14px;border-top:1.5px solid var(--ink)}

/* loader */
.loader{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;transition:opacity .35s}
.loader.hide{opacity:0;pointer-events:none}
.loader svg{width:260px;height:auto}
.loader .l-box{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.loader .l-proc{fill:var(--wash);stroke:var(--ink);stroke-width:2.5}
.loader .l-flow{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .8s .2s ease forwards}
.loader .l-flow.b{animation-delay:.5s}
.loader text{font:800 15px var(--display);font-stretch:115%;fill:var(--ink)}
.loader .l-cap{font:400 13px var(--body);fill:var(--soft)}

/* guide */
.guide{position:fixed;inset:0;z-index:55;background:rgba(15,20,32,.55);display:grid;place-items:center;padding:16px}
.guide[hidden]{display:none}
.g-card{width:min(540px,100%);background:var(--surface);border:2px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:28px 28px 22px;display:flex;flex-direction:column;gap:14px}
.g-step{font-size:14px;color:var(--soft);font-weight:700}
.g-card h2{font-size:28px;line-height:1.05;font-weight:800;font-stretch:118%}
.g-card p{margin:0;color:var(--soft);font-size:16px}
.g-demo{border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:66px;background:var(--bg)}
.g-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.g-dots{display:flex;gap:5px}
.g-dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.g-dots i.on{background:var(--ink)}
.g-btns{display:flex;gap:8px;align-items:center}
.skip{border:0;background:transparent;color:var(--soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:22px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion: reduce){.ctx .draw,.loader .l-flow{animation:none;stroke-dashoffset:0}.toast,.loader{transition:none}}

@media (max-width:1000px){
  .hero{grid-template-columns:1fr;gap:32px;padding-top:36px}
  .sec-head,.group{grid-template-columns:1fr;gap:12px}
  .idea{grid-template-columns:1fr;gap:14px}
  .ents{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stores,.rules-grid{grid-template-columns:1fr}
  .g-note{margin-left:0}
}
@media (max-width:640px){
  .bar{backdrop-filter:none;background:var(--bg)}
  .bar-in{gap:12px;padding:0 16px}
  .mark span{display:none}
  .tools .guide-btn{display:none}
  .wrap{padding:0 16px}
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--ink);padding:4px 8px;z-index:30}
  .nav a{border-bottom:0;border-top:3px solid transparent;margin:0;font-size:13.5px}
  .nav a.on{border-top-color:var(--blue)}
  body{padding-bottom:56px}
  .ents{grid-template-columns:1fr}
  .idea-form{grid-template-columns:1fr;padding:18px}
  .row{grid-template-columns:32px minmax(0,1fr);}
  .row .own{grid-column:2}
  .log-form{grid-template-columns:1fr}
  .log li{grid-template-columns:70px minmax(0,1fr) 30px}
  .log .w2{grid-column:2} .log .t{grid-column:1/-1}
  .rules li{grid-template-columns:1fr;gap:2px}
  .ds form{padding-left:0}
}
</style>
</head>
<body>

grefaldeo", "status": "todo"}, {"id": "d5", "text": "Deck: Figma design screens", "owner": "tarra", "status": "todo"}], "code": "P2"}, {"id": "m3", "title": "Recorded presentation", "due": "rec", "note": "Teams or Loom, max 20 minutes, every member presents. Due 1 week before the final presentation.", "items": [{"id": "r1", "text": "Assign speaking parts for all 4 members", "owner": "arradaza", "status": "todo"}, {"id": "r2", "text": "Rehearse once with a timer (stay under 20 min)", "owner": "", "status": "todo"}, {"id": "r3", "text": "Record and submit the video", "owner": "", "status": "todo"}], "code": "P3"}, {"id": "m4", "title": "SRS paper", "due": "2026-12-28", "note": "Finals paper, 30% of the grade.", "items": [{"id": "s1", "text": "SWOT analysis", "owner": "arradaza", "status": "todo"}, {"id": "s2", "text": "User stories → functional & non-functional requirements (from Weaknesses and Opportunities)", "owner": "barba", "status": "todo"}, {"id": "s3", "text": "Figma design (high fidelity)", "owner": "tarra", "status": "todo"}, {"id": "s4", "text": "Use case diagram (high level)", "owner": "grefaldeo", "status": "todo"}, {"id": "s5", "text": "Data flow diagrams: Context, Level 1, Level 2", "owner": "grefaldeo", "status": "todo"}, {"id": "s6", "text": "Data dictionaries", "owner": "grefaldeo", "status": "todo"}, {"id": "s7", "text": "Compile, format and proofread the SRS document", "owner": "arradaza", "status": "todo"}], "code": "P4"}, {"id": "m5", "title": "Final defense", "due": "final", "note": "On-site, semi-formal attire, 20-minute Q&A defense.", "items": [{"id": "f1", "text": "List likely panel questions and assign who answers each", "owner": "", "status": "todo"}, {"id": "f2", "text": "Confirm attire and arrival time", "owner": "", "status": "todo"}], "code": "P5"}], "links": [{"id": "drive", "label": "Shared Drive folder", "hint": "Main Google Drive folder for everything", "kind": "drive", "url": "https://drive.google.com/drive/folders/1srYTxG93hur_ajf <div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="app-script">
(function(){
  var SELF = document.currentScript;
  var state = JSON.parse(document.getElementById('portal-state').textContent);
  if(!state.ideas) state.ideas = [];
  var api = null, mode = 'connecting', timer = null;
  var LS_KEY = 'sysande-portal-local', editingLink = null, ideaFormOpen = false;
  var STATUSES = ['todo','doing','done'], STATUS_LABEL = {todo:'Not started', doing:'In progress', done:'Done'};
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function parse(d){ if(!d) return null; var p=d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function iso(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  function today(){ var n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function short(dt){ return dt ? MON[dt.getMonth()]+' '+dt.getDate() : 'Date to be set'; }
  function daysTo(dt){ return Math.round((dt - today())/86400000); }
  function member(id){ for(var i=0;i<state.members.length;i++) if(state.members[i].id===id) return state.members[i]; return null; }
  function col(id){ return 'var(--m-'+id+', var(--ink))'; }
  function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function dueOf(ms){
    if(ms.due==='final') return parse(state.finalDate);
    if(ms.due==='rec'){ var f=parse(state.finalDate); if(!f) return null; var r=new Date(f); r.setDate(r.getDate()-7); return r; }
    return parse(ms.due);
  }
  function left(dt){
    if(!dt) return {t:'Needs the presentation date', c:'soon'};
    var d=daysTo(dt);
    if(d<0) return {t:Math.abs(d)+(d===-1?' day ago':' days ago'), c:'past'};
    if(d===0) return {t:'Due today', c:'soon'};
    if(d===1) return {t:'Due tomorrow', c:'soon'};
    return {t:d+' days left', c:d<=7?'soon':''};
  }
  function allProjects(){ return state.ideas.concat(state.options); }
  function findProject(id){ return allProjects().filter(function(o){return o.id===id;})[0]; }
  function findItem(id){ for(var a=0;a<state.milestones.length;a++){ var it=state.milestones[a].items; for(var b=0;b<it.length;b++) if(it[b].id===id) return it[b]; } return null; }

  var IC = {
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    x:'<path d="M6 6l12 12M18 6 6 18"/>',
    open:'<path d="M14 4h6v6M10 14 20 4M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
    link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    check:'<path d="m5 12 5 5 9-10"/>',
    send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
    bot:'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4M9 14h.01M15 14h.01"/>'
  };
  function ic(n){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[n]||'')+'</svg>'; }
  function stIcon(s){
    if(s==='done') return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="currentColor"/><path d="m9 14.5 3.3 3.3L19 11" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    if(s==='doing') return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M14 5a9 9 0 0 1 0 18z" fill="currentColor"/></svg>';
    return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
  }

  /* theme */
  var ROOT=document.documentElement, HOST_THEME=ROOT.getAttribute('data-theme'), THEME_KEY='sysande-portal-theme', themePref='auto';
  try{ themePref=localStorage.getItem(THEME_KEY)||'auto'; }catch(e){}
  function applyTheme(){ if(themePref==='light'||themePref==='dark') ROOT.setAttribute('data-theme',themePref); else if(HOST_THEME) ROOT.setAttribute('data-theme',HOST_THEME); else ROOT.removeAttribute('data-theme'); }
  applyTheme();
  function modeSwitch(){
    return '<div class="mode" role="group" aria-label="Color theme">'+[['light','sun','Light theme'],['dark','moon','Dark theme'],['auto','auto','Match my device']].map(function(t){
      return '<button data-theme-set="'+t[0]+'" aria-pressed="'+(themePref===t[0])+'" title="'+t[2]+'" aria-label="'+t[2]+'">'+ic(t[1])+'</button>';}).join('')+'</div>';
  }

  /* ---------- render ---------- */
  var NAV=[['plan','Plan'],['ideas','Ideas'],['tasks','Tasks'],['team','Team'],['files','Files'],['rules','Rules'],['log','Updates']];
  function render(){
    var h='<header class="bar"><div class="bar-in"><a class="mark" href="#top">SYSANDE <span>finals</span></a>'+
      '<nav class="nav" aria-label="Sections">'+NAV.map(function(n){return '<a href="#'+n[0]+'" data-nav="'+n[0]+'">'+n[1]+'</a>';}).join('')+'</nav>'+
      '<div class="tools">'+modeSwitch()+'<button class="guide-btn" data-guide="1">How it works</button></div></div></header>';
    h+='<main class="wrap" id="top">'+hero()+plan()+ideas()+tasks()+team()+files()+rules()+log()+'</main>';
    h+='<footer><div class="wrap">'+state.members.map(function(m){return esc(m.first+' '+m.last);}).join(', ')+'. Built for our SYSANDE finals, Term 2, 2026.</div></footer>';
    document.getElementById('app').innerHTML=h;
    spy();
  }

  function nextDue(){
    return state.milestones.map(function(m){return {m:m,d:dueOf(m)};}).filter(function(p){return p.d&&p.d>=today();}).sort(function(a,b){return a.d-b.d;})[0];
  }

  function hero(){
    var nx=nextDue(), chosen=findProject(state.chosen), t=today();
    var total=0, done=0; state.milestones.forEach(function(m){m.items.forEach(function(i){total++; if(i.status==='done') done++;});});
    var lede = nx ? 'It’s '+DAY[t.getDay()]+'. Next up is <strong>'+esc(nx.m.title)+'</strong>, '+(daysTo(nx.d)===0?'<span class="late">due today</span>':(daysTo(nx.d)===1?'due tomorrow':'due in '+daysTo(nx.d)+' days'))+'. '+done+' of '+total+' tasks are done.' : 'No deadlines left. '+done+' of '+total+' tasks are done.';
    return '<section class="hero">'+
      '<div><h1>'+(chosen?esc(chosen.name):'Our finals project')+', mapped out.</h1>'+
      '<p class="lede">'+lede+'</p>'+
      '<div class="facts"><label for="f-course">Course<input id="f-course" value="'+esc(state.course)+'" placeholder="Course code"></label>'+
      '<label for="f-final">Final presentation<input id="f-final" type="date" value="'+esc(state.finalDate)+'"></label></div>'+
      '<div class="sync">'+syncText()+'</div></div>'+
      ctxDiagram(chosen)+'</section>';
  }

  function ctxDiagram(chosen){
    var W=560,H=400, cx=280, cy=200;
    var pos=[[18,24],[402,24],[18,316],[402,316]];
    var name = chosen ? chosen.name : 'Finals project';
    var s='<svg class="ctx" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Context diagram: the four members around the finals project"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--ink)"/></marker></defs>';
    state.members.forEach(function(m,i){
      var p=pos[i], ex=p[0]+70, ey=p[1]+30;
      var sx = i%2===0 ? p[0]+140 : p[0], sy = i<2 ? p[1]+60 : p[1];
      var tx = i%2===0 ? cx-60 : cx+60, ty = i<2 ? cy-52 : cy+52;
      var len = Math.round(Math.hypot(tx-sx,ty-sy))+2;
      s+='<path class="flow draw" style="--len:'+len+'" d="M'+sx+' '+sy+' L'+tx+' '+ty+'" marker-end="url(#ah)"/>';
      var mx=(sx+tx)/2, my=(sy+ty)/2 + (i<2?-6:14);
      var lab = (m.role||'').split(' / ')[0].trim(); if(lab.length>24) lab=lab.slice(0,23)+'…';
      s+='<text class="t-flow" x="'+mx+'" y="'+my+'" text-anchor="middle">'+esc(lab)+'</text>';
    });
    state.members.forEach(function(m,i){
      var p=pos[i];
      s+='<rect class="ent" x="'+p[0]+'" y="'+p[1]+'" width="140" height="60"/>';
      s+='<rect class="chip" x="'+p[0]+'" y="'+p[1]+'" width="7" height="60" style="fill:'+col(m.id)+'"/>';
      s+='<text class="t-ent" x="'+(p[0]+20)+'" y="'+(p[1]+28)+'">'+esc(m.last)+'</text>';
      s+='<text class="t-sub" x="'+(p[0]+20)+'" y="'+(p[1]+46)+'">'+esc(m.first)+'</text>';
    });
    s+='<rect class="proc" x="'+(cx-110)+'" y="'+(cy-62)+'" width="220" height="124" rx="18"/>';
    s+='<line x1="'+(cx-110)+'" y1="'+(cy-30)+'" x2="'+(cx+110)+'" y2="'+(cy-30)+'" stroke="var(--ink)" stroke-width="2"/>';
    s+='<text class="t-pid" x="'+cx+'" y="'+(cy-41)+'" text-anchor="middle">Process 0</text>';
    var nm = name.length>16 ? name.slice(0,15)+'…' : name;
    s+='<text class="t-proc" x="'+cx+'" y="'+(cy+10)+'" text-anchor="middle">'+esc(nm)+'</text>';
    s+='<text class="t-sub" x="'+cx+'" y="'+(cy+34)+'" text-anchor="middle">'+(chosen?'Chosen project':'Project not chosen yet')+'</text>';
    return s+'</svg>';
  }

  function syncText(){
    if(mode==='shared') return '<i class="ok"></i>Changes here are saved for the whole group';
    if(mode==='readonly') return '<i></i>View only. Ask Vik for edit access';
    if(mode==='local') return '<i></i>Changes are saved in this browser only';
    return '<i></i>Connecting…';
  }

  function head(id,title,desc,extra){
    return '<div class="sec-head"><h2>'+title+'</h2><div style="display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap"><p>'+desc+'</p>'+(extra||'')+'</div></div>';
  }

  function plan(){
    var h='<section class="sec" id="plan">'+head('plan','The plan','Five processes, in order. Each one opens its task list below. The recording is due a week before the final presentation, so set that date above.');
    h+='<div class="chain">';
    state.milestones.forEach(function(m,i){
      var d=dueOf(m), l=left(d), dn=m.items.filter(function(x){return x.status==='done';}).length, pct=m.items.length?Math.round(dn/m.items.length*100):0;
      if(i) h+='<div class="arrow" aria-hidden="true"><svg viewBox="0 0 40 16"><path d="M2 8h32" stroke="currentColor" stroke-width="2"/><path d="M30 3l7 5-7 5z" fill="currentColor"/></svg></div>';
      h+='<a class="p '+l.c+'" href="#g-'+m.id+'"><div class="p-top"><span>'+esc(m.code)+'</span><span>'+short(d)+'</span></div>'+
        '<div class="p-body"><h3>'+esc(m.title)+'</h3><div class="track" title="'+pct+'% done"><b style="width:'+pct+'%"></b></div>'+
        '<div class="p-left"><b>'+esc(l.t)+'</b><br>'+dn+' of '+m.items.length+' done</div></div></a>';
    });
    return h+'</div></section>';
  }

  function ideaRow(o,isIdea){
    var on=state.chosen===o.id, by=isIdea?member(o.by):null;
    var h='<article class="idea'+(on?' chosen':'')+'"><div><h3>'+esc(o.name)+'</h3>';
    h+= isIdea ? '<div class="who"><span class="dot" style="background:'+col(o.by)+'"></span>Posted by '+esc(by?by.first+' '+by.last:'the team')+'</div>' : '';
    h+='</div><div>';
    if(o.what) h+='<p class="sum">'+esc(o.what)+'</p>';
    if(o.desc) h+='<p>'+esc(o.desc)+'</p>';
    h+='<dl>';
    if(o.solves&&o.solves.length) h+='<dt>Solves</dt><dd><ul>'+o.solves.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></dd>';
    if(o.ai) h+='<dt>AI use</dt><dd>'+esc(o.ai)+'</dd>';
    if(o.sdg&&o.sdg.length) h+='<dt>SDG</dt><dd>'+o.sdg.map(esc).join(', ')+'</dd>';
    if(o.elicit) h+='<dt>Elicitation</dt><dd>'+esc(o.elicit)+'</dd>';
    h+='</dl></div><div class="decide"><div class="voters">'+state.members.map(function(m){
      var v=o.votes.indexOf(m.id)>-1;
      return '<button class="vt" style="--c:'+col(m.id)+'" data-vote="'+o.id+'" data-m="'+m.id+'" aria-pressed="'+v+'" title="'+esc(m.first)+(v?' backs this':' has not voted for this')+'">'+esc(m.first[0]+m.last[0])+'</button>';
    }).join('')+'</div><div class="tally">'+o.votes.length+' of '+state.members.length+' back this</div>'+
      '<button class="pick" data-pick="'+o.id+'">'+(on?ic('check')+'Our project':'Choose this')+'</button>'+
      (isIdea?'<button class="del" data-delidea="'+o.id+'">Remove idea</button>':'')+'</div></article>';
    return h;
  }

  function ideas(){
    var h='<section class="sec" id="ideas">'+head('ideas','Project ideas','Everyone posts at least one. A good idea uses AI and analytics, tackles a real problem today, and maps to an SDG. Tap your initials to back an idea, then choose one together.',
      '<button class="btn" data-ideaform="1">'+(ideaFormOpen?ic('x')+'Close':ic('plus')+'Post an idea')+'</button>');
    if(ideaFormOpen){
      h+='<form class="idea-form" id="idea-form">'+
        '<label for="i-by">Your name<select id="i-by" required><option value="">Choose</option>'+state.members.map(function(m){return '<option value="'+m.id+'">'+esc(m.first+' '+m.last)+'</option>';}).join('')+'</select></label>'+
        '<label for="i-name">Project name<input id="i-name" maxlength="40" placeholder="BantayBaha" required></label>'+
        '<label class="wide" for="i-what">In one line<input id="i-what" maxlength="70" placeholder="AI flood alerts for barangays"></label>'+
        '<label class="wide" for="i-desc">What it does<textarea id="i-desc" rows="3" placeholder="Who uses it, and what do they do with it?"></textarea></label>'+
        '<label class="wide" for="i-solves">Problems it solves <small>One per line</small><textarea id="i-solves" rows="3"></textarea></label>'+
        '<label for="i-ai">How it uses AI and analytics<input id="i-ai" placeholder="Forecasting, image recognition…"></label>'+
        '<label for="i-sdg">SDG<input id="i-sdg" placeholder="SDG 3, SDG 11"></label>'+
        '<label class="wide" for="i-elicit">Elicitation so far <small>Optional</small><input id="i-elicit" placeholder="Interviewed 3 tricycle drivers; survey with 25 replies"></label>'+
        '<div class="wide form-end"><button class="btn line" type="button" data-ideaform="1">Cancel</button><button class="btn" type="submit">'+ic('send')+'Post idea</button></div></form>';
    }
    if(state.ideas.length) h+='<div class="ideas">'+state.ideas.map(function(o){return ideaRow(o,true);}).join('')+'</div>';
    else h+='<div class="none"><span>No ideas posted yet. Be the first.</span><button class="btn line" data-ideaform="1">'+ic('plus')+'Post an idea</button></div>';
    h+='<div class="examples"><h3>'+ic('bot')+'Examples by Claude AI</h3><p>Three starting points drafted by Claude AI. Use one, mix them, or ignore them.</p><div class="ideas">'+state.options.map(function(o){return ideaRow(o,false);}).join('')+'</div></div>';
    return h+'</section>';
  }

  function tasks(){
    var h='<section class="sec" id="tasks">'+head('tasks','Tasks','Tap the circle to move a task along. Change the owner from the menu on the right.',
      '<div class="legend"><span class="st">'+stIcon('todo')+'</span>Not started <span class="st doing">'+stIcon('doing')+'</span>In progress <span class="st done">'+stIcon('done')+'</span>Done</div>');
    state.milestones.forEach(function(m){
      var d=dueOf(m), l=left(d);
      h+='<div class="group" id="g-'+m.id+'"><div><div class="g-id"><div class="g-pid">'+esc(m.code)+'</div><div><h3>'+esc(m.title)+'</h3><div class="when">'+short(d)+' · <b class="'+(l.c==='soon'?'late':'')+'">'+esc(l.t)+'</b></div></div></div>'+
        (m.note?'<p class="g-note">'+m.note+'</p>':'')+'</div><ul class="rows">'+m.items.map(function(i){
          return '<li class="row'+(i.status==='done'?' done':'')+'"><button class="st '+i.status+'" data-status="'+i.id+'" aria-label="'+STATUS_LABEL[i.status]+'. Change status">'+stIcon(i.status)+'</button>'+
            '<span class="txt">'+esc(i.text)+'</span><span class="own"><span class="dot" style="background:'+(i.owner?col(i.owner):'transparent')+';box-shadow:inset 0 0 0 1.5px '+(i.owner?'transparent':'var(--line)')+'"></span><select data-owner="'+i.id+'" aria-label="Owner">'+
            '<option value="">Unassigned</option>'+state.members.map(function(mm){return '<option value="'+mm.id+'"'+(i.owner===mm.id?' selected':'')+'>'+esc(mm.first)+'</option>';}).join('')+'</select></span></li>';
        }).join('')+'</ul></div>';
    });
    return h+'</section>';
  }

  function team(){
    var c={}; state.milestones.forEach(function(m){m.items.forEach(function(i){ if(i.owner){ c[i.owner]=c[i.owner]||{a:0,d:0}; c[i.owner].a++; if(i.status==='done') c[i.owner].d++; } });});
    var h='<section class="sec" id="team">'+head('team','Team','Roles for the Meet the Team slide. Click a role or focus to edit it.');
    h+='<div class="ents">'+state.members.map(function(m){
      var k=c[m.id]||{a:0,d:0};
      return '<div class="ent" style="--c:'+col(m.id)+'"><h3>'+esc(m.last)+'</h3><div class="fn">'+esc(m.first)+'</div>'+
        '<input class="role" data-mrole="'+m.id+'" value="'+esc(m.role)+'" aria-label="'+esc(m.first)+'’s role">'+
        '<input class="focus" data-mfocus="'+m.id+'" value="'+esc(m.focus)+'" aria-label="'+esc(m.first)+'’s focus">'+
        '<div class="load">'+k.d+' of '+k.a+' tasks done</div></div>';
    }).join('')+'</div></section>';
    return h;
  }

  function files(){
    var h='<section class="sec" id="files">'+head('files','Files','Every link the group needs, kept as data stores. Paste a share link once and everyone opens it from here.');
    h+='<div class="stores">'+state.links.map(function(k,i){
      var set=!!k.url, s='<div class="ds'+(set?' set':'')+'"><div class="ds-id">D'+(i+1)+'</div><div class="ds-main"><b>'+esc(k.label)+'</b><span>'+esc(set?k.url.replace(/^https?:\/\//,''):k.hint)+'</span></div><div class="ds-act">';
      s+= set ? '<a href="'+esc(k.url)+'" target="_blank" rel="noopener">'+ic('open')+'Open</a><button class="quiet" data-editlink="'+k.id+'" aria-label="Edit link" title="Edit link">'+ic('pen')+'</button>' : '<button data-editlink="'+k.id+'">'+ic('link')+'Add link</button>';
      s+='</div>';
      if(editingLink===k.id) s+='<form data-linkform="'+k.id+'"><input id="link-'+k.id+'" type="url" value="'+esc(k.url)+'" placeholder="Paste the share link" aria-label="Link for '+esc(k.label)+'"><button class="btn" type="submit">Save</button><button class="btn line" type="button" data-cancel="1">Cancel</button></form>';
      return s+'</div>';
    }).join('')+'</div></section>';
    return h;
  }

  function rules(){
    return '<section class="sec" id="rules">'+head('rules','Rules and grading','From the finals presentation guide.')+
      '<div class="rules-grid"><ul class="rules">'+
      '<li><b>Recording</b><span>Teams or Loom, 20 minutes at most. All four of us must present.</span></li>'+
      '<li><b>Deadline</b><span>Submit the recording one week before the final presentation.</span></li>'+
      '<li><b>Defense</b><span>20 minutes of Q&amp;A, on site.</span></li>'+
      '<li><b>Attire</b><span>Semi-formal.</span></li>'+
      '<li><b>Video</b><span>1 to 2 minutes and professional. Show the problem, then how the system solves it.</span></li>'+
      '<li><b>Project</b><span>Innovative, uses AI and analytics, tackles a current social issue, maps to an SDG, and comes from elicitation.</span></li></ul>'+
      '<div class="weights">'+
      '<div class="w"><span>Class participation: assignments, quizzes, seatwork, recitation</span><strong>35%</strong><div class="track"><b style="width:35%"></b></div></div>'+
      '<div class="w group-work"><span>Finals paper (SRS)</span><strong>30%</strong><div class="track"><b style="width:30%"></b></div></div>'+
      '<div class="w group-work"><span>Final presentation</span><strong>35%</strong><div class="track"><b style="width:35%"></b></div></div>'+
      '<p class="w-note">The blue bars are group work: 65% of the final grade.</p></div></div></section>';
  }

  function log(){
    var h='<section class="sec" id="log">'+head('log','Updates','Decisions and progress, so nobody has to dig through the group chat.');
    h+='<form class="log-form" id="log-form"><select id="log-by" aria-label="Who is posting"><option value="">Who’s posting?</option>'+state.members.map(function(m){return '<option value="'+m.id+'">'+esc(m.first+' '+m.last)+'</option>';}).join('')+'</select>'+
      '<input id="log-text" placeholder="Sent the survey to 30 students" aria-label="Update"><button class="btn" type="submit">'+ic('send')+'Post update</button></form>';
    h+= state.log.length ? '<ul class="log">'+state.log.slice().reverse().map(function(e){
      var m=member(e.by), d=parse(e.date);
      return '<li><span class="d">'+short(d)+'</span><span class="w2"><span class="dot" style="background:'+(m?col(m.id):'var(--line)')+'"></span>'+esc(m?m.first:'Team')+'</span><span class="t">'+esc(e.text)+'</span><button class="x" data-dellog="'+e.id+'" aria-label="Delete this update" title="Delete">'+ic('x')+'</button></li>';
    }).join('')+'</ul>' : '<p style="color:var(--soft)">No updates yet.</p>';
    return h+'</section>';
  }

  var spyObs=null;
  function spy(){
    if(!('IntersectionObserver' in window)) return;
    if(spyObs) spyObs.disconnect();
    spyObs=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) document.querySelectorAll('[data-nav]').forEach(function(a){ a.classList.toggle('on', a.dataset.nav===e.target.id); }); }); },{rootMargin:'-35% 0px -55% 0px'});
    NAV.forEach(function(n){ var el=document.getElementById(n[0]); if(el) spyObs.observe(el); });
  }

  /* ---------- saving ---------- */
  function commit(msg){
    var y=window.scrollY; render(); window.scrollTo(0,y);
    if(mode==='readonly'){ toast('View only. Your change was not saved'); return; }
    if(mode!=='shared'){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} if(msg) toast(msg); return; }
    clearTimeout(timer); timer=setTimeout(publish,900); if(msg) toast(msg);
  }
  function buildDoc(){
    var json=JSON.stringify(state).replace(/</g,'\\u003c');
    var head='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>SYSANDE Finals Portal</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
      document.getElementById('app-fonts').outerHTML+'\n'+document.getElementById('app-style').outerHTML;
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+head+'\n</head>\n<body>\n<script type="application/json" id="portal-state">'+json+'<\/script>\n<div id="app"></div>\n<div class="toast" id="toast" role="status" aria-live="polite"></div>\n'+SELF.outerHTML+'\n</body>\n</html>';
  }
  function publish(){
    if(!api) return;
    api.publish(buildDoc()).catch(function(err){
      var code=(err&&(err.code||err.name||err.message))||'';
      if(/not_granted|not_writer/.test(code)){ mode='readonly'; render(); toast('View only. Your change was not saved'); }
      else if(!/conflict/.test(code)) toast('Couldn’t save. Try again in a moment');
    });
  }
  var toastT;
  function toast(t){ var el=document.getElementById('toast'); if(!el) return; el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('show');},1900); }
  function keepScroll(fn){ var y=window.scrollY; fn(); render(); window.scrollTo(0,y); }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var d=b.dataset;
    if(d.status){ var it=findItem(d.status); it.status=STATUSES[(STATUSES.indexOf(it.status)+1)%3]; commit(); }
    else if(d.vote){ var o=findProject(d.vote), i=o.votes.indexOf(d.m); if(i>-1) o.votes.splice(i,1); else o.votes.push(d.m); commit(); }
    else if(d.pick){ state.chosen = state.chosen===d.pick?'':d.pick; commit(state.chosen?'Project chosen':'Choice cleared'); }
    else if(d.ideaform){ keepScroll(function(){ ideaFormOpen=!ideaFormOpen; }); var f=document.getElementById('i-by'); if(f) f.focus(); }
    else if(d.delidea){ state.ideas=state.ideas.filter(function(x){return x.id!==d.delidea;}); if(state.chosen===d.delidea) state.chosen=''; commit('Idea removed'); }
    else if(d.editlink){ keepScroll(function(){ editingLink=d.editlink; }); var inp=document.getElementById('link-'+editingLink); if(inp) inp.focus(); }
    else if(d.cancel){ keepScroll(function(){ editingLink=null; }); }
    else if(d.dellog){ state.log=state.log.filter(function(x){return x.id!==d.dellog;}); commit('Update deleted'); }
    else if(d.themeSet){ themePref=d.themeSet; try{ localStorage.setItem(THEME_KEY,themePref); }catch(err){} applyTheme(); document.querySelectorAll('[data-theme-set]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.themeSet===themePref)); }); }
    else if(d.guide){ openGuide(0); }
    else if(d.g){ guideNav(d.g); }
  });
  document.addEventListener('change',function(e){
    var el=e.target, d=el.dataset;
    if(d.owner){ findItem(d.owner).owner=el.value; commit(); }
    else if(d.mrole){ member(d.mrole).role=el.value.trim(); commit('Role saved'); }
    else if(d.mfocus){ member(d.mfocus).focus=el.value.trim(); commit('Saved'); }
    else if(el.id==='f-course'){ state.course=el.value.trim(); commit('Saved'); }
    else if(el.id==='f-final'){ state.finalDate=el.value; commit('Presentation date set'); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.matches('.ent input, #f-course')){ e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('submit',function(e){
    e.preventDefault(); var f=e.target;
    if(f.dataset.linkform){
      var v=document.getElementById('link-'+f.dataset.linkform).value.trim();
      if(v && !/^https?:\/\//i.test(v)) v='https://'+v;
      state.links.forEach(function(k){ if(k.id===f.dataset.linkform) k.url=v; });
      editingLink=null; commit(v?'Link saved':'Link removed');
    } else if(f.id==='idea-form'){
      function val(id){ return document.getElementById(id).value.trim(); }
      var by=val('i-by'), name=val('i-name');
      if(!by||!name){ toast('Add your name and a project name'); return; }
      state.ideas.push({id:uid(), by:by, name:name, what:val('i-what'), desc:val('i-desc'),
        solves:val('i-solves').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean), ai:val('i-ai'),
        sdg:val('i-sdg').split(/[,;]+/).map(function(x){return x.trim();}).filter(Boolean), elicit:val('i-elicit'), votes:[by]});
      state.log.push({id:uid(), date:iso(today()), by:by, text:'Posted a project idea: '+name});
      ideaFormOpen=false; commit('Idea posted');
    } else if(f.id==='log-form'){
      var txt=document.getElementById('log-text').value.trim();
      if(!txt){ toast('Write an update first'); return; }
      state.log.push({id:uid(), date:iso(today()), by:document.getElementById('log-by').value, text:txt});
      commit('Update posted');
    }
  });

  /* ---------- loader + guide ---------- */
  var GUIDE_KEY='sysande-portal-guide-seen', step=0, lastFocus=null;
  var STEPS=[
    {t:'This is our project, drawn as a diagram', p:'The top of the page is a context diagram: the four of us around the project. Once we choose an idea, its name appears in the middle.', d:function(){ return state.members.map(function(m){return '<span class="vt" style="--c:'+col(m.id)+'" aria-pressed="true">'+esc(m.first[0]+m.last[0])+'</span>';}).join(''); }},
    {t:'The plan runs P1 to P5', p:'Each process is a deadline. Red means it’s due within a week. Set the final presentation date at the top so the recording deadline appears.', d:function(){ return '<b>P1</b> Project options → <b>P2</b> Video and deck → <b>P4</b> SRS'; }},
    {t:'Post an idea, then vote', p:'Under Ideas, press Post an idea. Tap your initials on any idea you back. When we agree, press Choose this. Claude AI’s three examples are below ours for reference.', d:function(){ return '<span class="btn">'+ic('plus')+'Post an idea</span><span class="pick">Choose this</span>'; }},
    {t:'Move tasks along', p:'Tap a task’s circle to go from not started, to in progress, to done. Change who owns it from the menu beside it.', d:function(){ return '<span class="st">'+stIcon('todo')+'</span><span class="st doing">'+stIcon('doing')+'</span><span class="st done">'+stIcon('done')+'</span>'; }},
    {t:'Files live in data stores', p:'D1 is our shared Drive folder. Add the links for the SRS doc, Canva deck, Figma and videos once, and everyone opens them from here.', d:function(){ return '<b>D1</b> Shared Drive folder'; }},
    {t:'Light, dark, or match your device', p:'Use the three buttons in the top bar to pick a theme.', d:function(){ return modeSwitch(); }},
    {t:'How changes are saved', p:'', d:function(){ return '<span class="sync" style="margin:0">'+syncText()+'</span>'; }}
  ];
  function savedText(){
    if(mode==='shared') return 'Everything you change here is saved for the whole group.';
    if(mode==='readonly') return 'You can look around, but changes won’t save. Ask Vik for edit access.';
    return 'On this site, your changes stay in your own browser, so the rest of the group won’t see them. Post important things in the group chat too.';
  }
  function showLoader(){
    var first=true; try{ first=!sessionStorage.getItem('sysande-portal-loaded'); sessionStorage.setItem('sysande-portal-loaded','1'); }catch(e){}
    if(!first) return Promise.resolve();
    var el=document.createElement('div'); el.className='loader'; el.setAttribute('role','status'); el.setAttribute('aria-label','Loading');
    el.innerHTML='<svg viewBox="0 0 260 150" aria-hidden="true"><rect class="l-box" x="4" y="40" width="70" height="44"/><path class="l-flow" d="M74 62h50"/><rect class="l-proc" x="126" y="28" width="96" height="68" rx="14"/><path class="l-flow b" d="M222 62h34"/><text x="174" y="68" text-anchor="middle">P0</text><text class="l-cap" x="130" y="134" text-anchor="middle">Opening the SYSANDE portal</text></svg>';
    document.body.appendChild(el);
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    return new Promise(function(res){ setTimeout(function(){ el.classList.add('hide'); setTimeout(function(){ el.remove(); res(); }, reduce?0:350); }, reduce?250:1300); });
  }
  function guideEl(){
    var g=document.getElementById('guide');
    if(!g){ g=document.createElement('div'); g.id='guide'; g.className='guide'; g.hidden=true; g.setAttribute('role','dialog'); g.setAttribute('aria-modal','true'); g.setAttribute('aria-labelledby','g-title'); document.body.appendChild(g); g.addEventListener('click',function(e){ if(e.target===g) closeGuide(); }); }
    return g;
  }
  function drawGuide(){
    var s=STEPS[step], last=step===STEPS.length-1;
    guideEl().innerHTML='<div class="g-card"><div class="g-step">Step '+(step+1)+' of '+STEPS.length+'</div><h2 id="g-title">'+esc(s.t)+'</h2><p>'+esc(s.p||savedText())+'</p><div class="g-demo">'+s.d()+'</div>'+
      '<div class="g-foot"><div class="g-dots">'+STEPS.map(function(_,i){return '<i class="'+(i<=step?'on':'')+'"></i>';}).join('')+'</div><div class="g-btns">'+
      (last?'':'<button class="skip" data-g="skip">Skip</button>')+(step>0?'<button class="btn line" data-g="back">Back</button>':'')+
      '<button class="btn" data-g="next" id="g-next">'+(last?'Start':'Next')+'</button></div></div></div>';
    var n=document.getElementById('g-next'); if(n) n.focus();
  }
  function openGuide(i){ lastFocus=document.activeElement; step=i||0; guideEl().hidden=false; drawGuide(); }
  function closeGuide(){ guideEl().hidden=true; try{ localStorage.setItem(GUIDE_KEY,'1'); }catch(e){} if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
  function guideNav(a){ if(a==='skip') return closeGuide(); if(a==='back'){ step=Math.max(0,step-1); return drawGuide(); } if(step===STEPS.length-1) return closeGuide(); step++; drawGuide(); }
  document.addEventListener('keydown',function(e){ var g=document.getElementById('guide'); if(!g||g.hidden) return; if(e.key==='Escape') closeGuide(); else if(e.key==='ArrowRight') guideNav('next'); else if(e.key==='ArrowLeft') guideNav('back'); });

  render();
  showLoader().then(function(){ var seen=false; try{ seen=!!localStorage.getItem(GUIDE_KEY); }catch(e){} if(!seen) openGuide(0); });
  function loadLocal(){ try{ var s=localStorage.getItem(LS_KEY); if(s){ state=JSON.parse(s); if(!state.ideas) state.ideas=[]; } }catch(e){} }
  var cl=window.claude;
  if(cl&&typeof cl.use==='function'){
    cl.use('artifact').then(function(a){ if(a){ api=a; mode='shared'; } else { mode='local'; loadLocal(); } render(); }).catch(function(){ mode='local'; loadLocal(); render(); });
  } else { mode='local'; loadLocal(); render(); }
})();
</script>
</body>
</html>
